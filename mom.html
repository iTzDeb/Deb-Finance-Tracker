<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1177cc">
<title>Family view</title>
<style>
:root{--bg:#f4f6f2;--ink:#1b2a38;--muted:#5c6672;--line:#dde4dc;--brand:#1177cc;--in:#17703a;--out:#b3261e;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brandline{display:flex;align-items:center;gap:11px}
.brandline img{width:40px;height:40px;border-radius:12px;object-fit:cover;display:block}
header b{font-size:18px}
button{font:inherit;cursor:pointer}
.lock{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:20px 16px 56px}
.gate{max-width:380px;margin:10vh auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px}
.gate h1{font-size:22px;margin:0 0 6px}
.gate p{color:var(--muted);font-size:15px;margin:0 0 18px}
input{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:12px}
.btn{width:100%;margin-top:14px;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:650;font-size:17px}
.err{color:var(--out);font-size:15px;margin-top:12px;display:none}
.select{width:100%;font:inherit;font-size:17px;padding:13px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);margin-bottom:16px}
.lead{font-size:18px;margin:0 0 14px}
.lead b{font-weight:700}
.net{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.net span{font-size:14px;color:var(--muted)}
.net strong{font-size:22px;font-variant-numeric:tabular-nums}
.plus{color:var(--in)}.minus{color:var(--out)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px}
.card .k{font-size:14px;color:var(--muted)}
.card .v{font-size:25px;font-weight:750;margin-top:5px;font-variant-numeric:tabular-nums}
h2{font-size:16px;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 small{font-size:13px;color:var(--muted);font-weight:400}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:8px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.txn-list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.txn{display:flex;justify-content:space-between;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line);align-items:center}
.txn:last-child{border-bottom:0}
.t-main{display:flex;flex-direction:column;min-width:0}
.t-date{font-size:13px;color:var(--muted)}
.t-party{font-size:17px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-cat{display:inline-block;font-size:11px;color:var(--muted);background:var(--line);border-radius:999px;padding:1px 8px;margin-top:4px}
.t-amt{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.empty{color:var(--muted);font-size:15px;padding:16px;margin:0}
.search{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);margin:8px 0 2px}
.day{margin-bottom:20px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 3px 8px}
.day-head b{font-size:15px}
.day-head span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.day-list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{text-align:right;padding:12px;border-bottom:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.hidden{display:none}
@media(max-width:420px){.grid{grid-template-columns:1fr}.card .v{font-size:23px}}
</style>
</head>
<body>
<header><div class="brandline"><img src="favicon.png" alt=""><b>Family view</b></div><button class="lock" id="lock" hidden>Lock</button></header>
<main>
  <section id="gate" class="gate">
    <h1>Family view</h1>
    <p>Please enter the password to see the monthly summary.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="go">View</button>
    <div class="err" id="err"></div>
  </section>
  <section id="app" class="hidden">
    <select class="select" id="month" aria-label="Choose month"></select>
    <p class="lead" id="lead"></p>
    <div class="net"><span>Left over this month</span><strong id="net"></strong></div>
    <div class="grid" id="cards"></div>
    <h2>Money in &amp; out <small id="txCount"></small></h2>
    <input id="q" class="search" type="search" placeholder="Search by name, category or amount" aria-label="Search transactions">
    <div class="legend"><span><i style="background:var(--in)"></i>Green = money in</span><span><i style="background:var(--out)"></i>Red = money out</span></div>
    <div id="txns"></div>
    <h2>Last 12 months</h2>
    <table><thead><tr><th>Month</th><th>Money in</th><th>Money out</th></tr></thead><tbody id="rows"></tbody></table>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inr = n => '₹' + (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });
const shortDate = d => { const x = new Date(d + 'T00:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); };
const monthLabel = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }); };
const cls = n => n >= 0 ? 'plus' : 'minus';
const sgn = n => (n >= 0 ? '+' : '−') + inr(Math.abs(n));
let data = null, pw = '', query = '';
async function fetchData(password, month) {
  const body = { action: 'mom', password };
  if (month) body.month = month;
  const res = await fetch('api/exec', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const r = await res.json();
  if (!r.ok) throw new Error(r.error || 'failed');
  return r;
}
function render() {
  const sel = $('#month');
  const m = data.months.find(x => x.month === sel.value) || data.months[0];
  $('#lead').innerHTML = 'Here is <b>' + monthLabel(m.month) + '</b> at a glance.';
  const net = (m.incoming || 0) - (m.outgoing || 0);
  const netEl = $('#net'); netEl.textContent = sgn(net); netEl.className = cls(net);
  const cards = [
    ['Money in', m.incoming, 'plus'],
    ['Money out', m.outgoing, 'minus'],
    ['Business income', m.businessIncome, 'plus'],
    ['Business expense', m.businessExpense, 'minus'],
    ['Personal expense', m.personalExpense, 'minus']
  ];
  $('#cards').innerHTML = cards.map(c => '<div class="card"><div class="k">' + c[0] + '</div><div class="v ' + c[2] + '">' + (c[2] === 'plus' ? '+' : '−') + inr(c[1]) + '</div></div>').join('');
  renderTxns();
  $('#rows').innerHTML = data.months.map(x => '<tr><td>' + monthLabel(x.month) + '</td><td class="plus">+' + inr(x.incoming) + '</td><td class="minus">−' + inr(x.outgoing) + '</td></tr>').join('');
}
function dayHeading(date) {
  const d = new Date(date + 'T00:00:00');
  if (isNaN(d)) return date;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
}
function renderTxns() {
  const all = (data.transactions || []).filter(t => !t.hidden);
  const q = query.trim().toLowerCase();
  const list = q
    ? all.filter(t => (String(t.counterparty || '') + ' ' + String(t.category || '') + ' ' + String(t.amount || '')).toLowerCase().includes(q))
    : all;
  $('#txCount').textContent = list.length + (list.length === 1 ? ' transaction' : ' transactions');
  if (!list.length) {
    $('#txns').innerHTML = '<p class="empty">' + (q ? 'No matching transactions.' : 'No transactions this month.') + '</p>';
    return;
  }
  const groups = new Map();
  for (const t of list) {
    if (!groups.has(t.date)) groups.set(t.date, []);
    groups.get(t.date).push(t);
  }
  $('#txns').innerHTML = [...groups.entries()].map(([date, rows]) => {
    let inSum = 0, outSum = 0;
    const body = rows.map(t => {
      const credit = t.direction === 'CREDIT';
      if (credit) inSum += Number(t.amount) || 0; else outSum += Number(t.amount) || 0;
      return '<div class="txn"><div class="t-main"><span class="t-party">' + esc(t.counterparty) + '</span><span class="t-cat">' + esc(t.category) + '</span></div><span class="t-amt ' + (credit ? 'plus' : 'minus') + '">' + (credit ? '+' : '−') + inr(t.amount) + '</span></div>';
    }).join('');
    const bits = [];
    if (inSum) bits.push('<span class="plus">in +' + inr(inSum) + '</span>');
    if (outSum) bits.push('<span class="minus">out −' + inr(outSum) + '</span>');
    return '<section class="day"><div class="day-head"><b>' + dayHeading(date) + '</b><span>' + bits.join(' · ') + '</span></div><div class="day-list">' + body + '</div></section>';
  }).join('');
}
function showApp() {
  $('#gate').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#lock').hidden = false;
}
async function load(month) {
  data = await fetchData(pw, month);
  const sel = $('#month');
  if (!sel.options.length) sel.innerHTML = data.months.map(x => '<option value="' + x.month + '">' + monthLabel(x.month) + '</option>').join('');
  sel.value = data.month;
  render();
}
async function enter() {
  const value = $('#pw').value;
  if (!value) return;
  const err = $('#err'); err.style.display = 'none';
  pw = value;
  try { await load(); sessionStorage.setItem('mom_pw', pw); showApp(); }
  catch (e) { pw = ''; err.textContent = e.message; err.style.display = 'block'; }
}
function lock() {
  sessionStorage.removeItem('mom_pw');
  pw = ''; data = null;
  $('#app').classList.add('hidden');
  $('#gate').classList.remove('hidden');
  $('#lock').hidden = true;
  $('#pw').value = ''; $('#pw').focus();
}
$('#go').addEventListener('click', enter);
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
$('#lock').addEventListener('click', lock);
$('#month').addEventListener('change', () => { load($('#month').value).catch(e => { $('#txns').innerHTML = '<p class="empty">' + esc(e.message) + '</p>'; }); });
$('#q').addEventListener('input', e => { query = e.target.value; renderTxns(); });
(async () => {
  const saved = sessionStorage.getItem('mom_pw');
  if (!saved) return $('#pw').focus();
  pw = saved;
  try { await load(); showApp(); }
  catch { sessionStorage.removeItem('mom_pw'); pw = ''; $('#pw').focus(); }
})();
</script>
</body>
</html>
