  <button class="tab on" data-tab="pending" id="tabPending" aria-pressed="true" aria-controls="view"><span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5H6a2 2 0 0 0-2 2v13h16V7a2 2 0 0 0-2-2h-2"/><rect x="8" y="3" width="8" height="4" rx="1.5"/><path d="m8 13 1.5 1.5L12 12m2 1h3m-9 5 1.5 1.5L12 18m2 1h3"/></svg></span>Pending</button>
  <button class="tab" data-tab="month" id="tabMonth" aria-pressed="false" aria-controls="view"><span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01" stroke-width="2.4"/></svg></span>Month</button>
  <button class="tab" data-tab="history" id="tabHistory" aria-pressed="false" aria-controls="view"><span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5m4-1v5l3 2"/></svg></span>History</button>
</nav>
<div class="scrim" id="scrim" aria-hidden="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
const BUCKETS = ['Business', 'Personal', 'Internal', 'Deposit'];
const DEFAULT_WEB_APP_URL = 'https://deb-finance.vercel.app/api/exec';
const CATS = ['Electricity', 'Plumbing', 'Repairs', 'Groceries', 'Rent', 'Staff',
  'Chai and snacks', 'Cigarettes', 'Fuel', 'Medicine', 'Food out', 'Family support',
  'Self transfer', 'Deposit refund', 'Tenant rent', 'Reimbursement', 'Other'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + (Number(n) || 0).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const sumObj = o => Object.values(o).reduce((a, b) => a + b, 0);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const monthLabel = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }); };
const shortDate = s => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); };
const fmtStamp = s => { const d = new Date(String(s || '').replace(' ', 'T')); return isNaN(d) ? s : d.toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
function dayHeading(s) {
  const d = new Date(s + 'T00:00:00');
  if (isNaN(d)) return 'Date unavailable';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (d.getTime() === today.getTime()) return 'Today';
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
  if (d.getTime() === yesterday.getTime()) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
}
function categoryIcon(item) {
  const category = String(item.sCategory || item.category || '').toLowerCase();
  if (/grocer/.test(category)) return '🛒';
  if (/fuel/.test(category)) return '⛽';
  if (/rent|property/.test(category)) return '⌂';
  if (/medicine/.test(category)) return '✚';
  if (/food|chai|snack/.test(category)) return '☕';
  if (/electric/.test(category)) return 'ϟ';
  if (/repair|plumb/.test(category)) return '⌁';
  if (/transfer|deposit/.test(category)) return '↔';
  return item.direction === 'CREDIT' ? '↓' : '↑';
}
const cfg = () => { const saved = JSON.parse(localStorage.getItem('fin_cfg') || '{}'); return { ...saved, url: saved.url || DEFAULT_WEB_APP_URL }; };

let items = [];
let state = { tab: 'pending', filter: 'all', query: '', pendingView: 'rows', month: ymd(new Date()), historyFilter: 'all', historyQuery: '', historyPeriod: null };
let ctx = null;
let pendingVisibleCount = 40;

// ---------- Network (the Vercel backend sends CORS headers, so a normal fetch works) ----------
async function api(action, extra = {}, ms = 25000) {
  const c = cfg();
  if (!c.url || !c.key) throw new Error('open Settings first');
  const started = performance.now();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  let r;
  try {
    const res = await fetch(c.url + '?' + new URLSearchParams({ key: c.key, action, ...extra }), { signal: controller.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    r = await res.json();
  } finally {
    clearTimeout(timer);
    showApiDuration(performance.now() - started);
  }
  if (!r.ok) throw new Error(r.error || 'failed');
  return r;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), 2200);
}
function setStatus(msg) { $('#status').textContent = msg; }
// Updates the opt-in display of the latest API duration.
let lastApiDurationMs = null;
let historyDebug = { cachePaintMs: null, networkMs: null, serverMs: null };

// Renders the last API and History timings only when debugging is enabled.
function renderApiDebug() {
  const line = $('#debugStatus');
  const enabled = localStorage.getItem('fin_debug') === '1';
  line.hidden = !enabled;
  if (!enabled) return;
  const value = ms => Number.isFinite(ms) ? `${Math.round(ms)} ms` : '—';
  line.textContent = `Last server call: ${value(lastApiDurationMs)} · History: cache paint ${value(historyDebug.cachePaintMs)}, network ${value(historyDebug.networkMs)}, server ${value(historyDebug.serverMs)}`;
}

// Retains the existing API duration measurement while refreshing the debug line.
function showApiDuration(ms) {
  lastApiDurationMs = ms;
  renderApiDebug();
}
function renderLoading() { $('#view').innerHTML = '<div class="skel"></div><div class="skel"></div>'; }

// ---------- Sheet (bottom panel) ----------
let sheetTrigger = null;
function openSheet(html) {
  sheetTrigger = document.activeElement;
  $('#sheet').innerHTML = html;
  $('#sheet').setAttribute('role', 'dialog');
  $('#sheet').setAttribute('aria-modal', 'true');
  $('#sheet').setAttribute('aria-labelledby', 'sheetTitle');
  $('#scrim').setAttribute('aria-hidden', 'false');
  $('#scrim').classList.add('on');
  setBackgroundInert(true);
  $('#sheet').querySelector('input, button')?.focus({ preventScroll: true });
}
function closeSheet() {
  $('#scrim').classList.remove('on');
  $('#scrim').setAttribute('aria-hidden', 'true');
  setBackgroundInert(false);
  if (sheetTrigger instanceof HTMLElement) sheetTrigger.focus({ preventScroll: true });
}
// Keeps background content out of the tab order / screen-reader tree while a sheet is open.
function setBackgroundInert(inert) {
  document.querySelectorAll('header, main, nav').forEach(el => { el.inert = inert; });
}
$('#scrim').addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key !== 'Tab') return;
  const controls = [...$('#sheet').querySelectorAll('button:not(:disabled), input:not(:disabled), textarea:not(:disabled)')];
  if (!controls.length) return;
  const first = controls[0], last = controls[controls.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });

// Draws selection chips from the current edit-sheet state.
function renderChoiceChips(container) {
  if (!container || !ctx) return;
  const group = container.dataset.choiceGroup;
  container.setAttribute('role', 'group');
  container.setAttribute('aria-label', group === 'bucket' ? 'Bucket' : 'Category');
  const values = group === 'bucket' ? BUCKETS : CATS;
  container.innerHTML = values.map(value => `<button type="button" class="${group === 'category' ? 'chip ' : ''}${ctx[group] === value ? 'on' : ''}" data-value="${esc(value)}" aria-pressed="${ctx[group] === value}">${esc(value)}</button>`).join('');
}
// Delegates chip selection to the container while keeping state authoritative.
function bindChoiceChips(container) {
  container.addEventListener('click', event => {
    const button = event.target.closest('button[data-value]');
    if (!button || !container.contains(button)) return;
    const group = container.dataset.choiceGroup;
    if ((group === 'bucket' ? BUCKETS : CATS).includes(button.dataset.value)) {
      ctx[group] = button.dataset.value;
      renderChoiceChips(container);
    }
  });
}

// ---------- Pending ----------
async function loadPending() {
  const cached = JSON.parse(localStorage.getItem('fin_cache') || 'null');
  if (!items.length) {
    if (cached) { items = cached.items; renderPending(); setStatus('Saved list · updating…'); }
    else renderLoading();
  }
  try {
    const r = await api('pending');
    items = r.items;
    pendingVisibleCount = 40;
    localStorage.setItem('fin_cache', JSON.stringify({ at: Date.now(), items }));
    setStatus('Updated ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }));
    renderPending();
  } catch (e) {
    if (items.length) setStatus('Offline · showing saved list');
    else {
      $('#view').innerHTML = `<div class="empty"><b>Couldn't reach the server</b>${esc(e.message)}<br><br>
        <button class="btn primary" data-act="settings">Open settings</button></div>`;
      setStatus('Not connected');
    }
  }
}

function renderPending() {
  const review = items.filter(i => i.status === 'NEEDS REVIEW').length;
  const sugg = items.length - review;
  const openValue = items.reduce((total, item) => total + (Number(item.amount) || 0), 0);
  $('#view').innerHTML = `
    <div class="page-head">
      <div><h1>Transactions</h1><p class="page-description">Review each match before it is added to your sheet.</p></div>
      <div class="review-count"><strong>${review}</strong><span>need review</span></div>
    </div>
    <section class="overview-strip" aria-label="Pending transaction totals">
      <div class="overview-stat attention"><span>Need a decision</span><strong>${review}</strong></div>
      <div class="overview-stat"><span>Ready to confirm</span><strong>${sugg}</strong></div>
      <div class="overview-stat"><span>Open transaction value</span><strong>${inr(openValue)}</strong></div>
    </section>
    <div class="filter-row">
      <div class="seg" id="pendingFilters" role="group" aria-label="Filter transactions"></div>
    </div>
    <div class="seg pending-view-toggle" id="pendingViewToggle" role="group" aria-label="Pending view"></div>
    <input class="search" id="q" type="search" aria-label="Search transactions" placeholder="Search payee, note or amount" value="${esc(state.query)}">
    <div id="list" aria-live="polite"></div>`;
  renderPendingControls();
  $('#q').addEventListener('input', e => { state.query = e.target.value; pendingVisibleCount = 40; renderList(); });
  renderList();
}

// Redraws Pending controls without replacing the page or search field.
function renderPendingControls() {
  const review = items.filter(item => item.status === 'NEEDS REVIEW').length;
  const suggested = items.length - review;
  $('#pendingFilters').innerHTML = `
    <button data-filter="all" aria-pressed="${state.filter === 'all'}" class="${state.filter === 'all' ? 'on' : ''}">All ${items.length}</button>
    <button data-filter="review" aria-pressed="${state.filter === 'review'}" class="${state.filter === 'review' ? 'on' : ''}">Review ${review}</button>
    <button data-filter="sugg" aria-pressed="${state.filter === 'sugg'}" class="${state.filter === 'sugg' ? 'on' : ''}">Suggested ${suggested}</button>`;
  $('#pendingViewToggle').innerHTML = `
    <button data-pending-view="rows" aria-pressed="${state.pendingView === 'rows'}" class="${state.pendingView === 'rows' ? 'on' : ''}">Rows</button>
    <button data-pending-view="payee" aria-pressed="${state.pendingView === 'payee'}" class="${state.pendingView === 'payee' ? 'on' : ''}">Group by payee</button>`;
}

function renderList() {
  if (!items.length) {
    $('#list').innerHTML = '<div class="empty"><b>You’re all caught up</b>New transactions will appear here when they need a category.<br><a class="btn primary" href="import.html">Import a statement</a></div>';
    return;
  }
  const q = state.query.trim().toLowerCase();
  const list = items.filter(i => {
    if (state.filter === 'review' && i.status !== 'NEEDS REVIEW') return false;
    if (state.filter === 'sugg' && i.status !== 'PENDING') return false;
    if (!q) return true;
    return `${i.counterparty} ${i.notes} ${i.amount}`.toLowerCase().includes(q);
  });
  if (!list.length) {
    $('#list').innerHTML = '<div class="empty"><b>No matching transactions</b>Try another search or choose a different filter.</div>';
    return;
  }
  if (state.pendingView === 'payee') {
    const groups = groupPendingByPayee(list);
    const visibleGroups = groups.slice(0, pendingVisibleCount);
    $('#list').innerHTML = `<div class="payee-groups">${visibleGroups.map(payeeGroupCard).join('')}</div>${groups.length > visibleGroups.length ? '<button class="btn ghost history-more" data-act="pending-more">Show more</button>' : ''}`;
    return;
  }
  const visibleItems = list.slice(0, pendingVisibleCount);
  const groups = groupByDate(visibleItems);
  $('#list').innerHTML = groups.map(([date, dayItems]) => `
    <section class="day-group" aria-label="${esc(dayHeading(date))}">
      <div class="day-heading"><h2>${esc(dayHeading(date))}</h2><span>${dayItems.length} ${dayItems.length === 1 ? 'transaction' : 'transactions'}</span></div>
      <div class="day-list">${dayItems.map(card).join('')}</div>
    </section>`).join('') + (list.length > visibleItems.length ? '<button class="btn ghost history-more" data-act="pending-more">Show more</button>' : '');
}

// Normalizes the payee label for consistent grouping in the Pending view.
function pendingPayeeKey(payee) {
  return String(payee || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

// Groups only open Pending and Needs Review rows by payee.
function groupPendingByPayee(entries) {
  const groups = new Map();
  entries.forEach(item => {
    if (item.status !== 'PENDING' && item.status !== 'NEEDS REVIEW') return;
    const payee = String(item.counterparty || '').trim();
    const key = pendingPayeeKey(payee);
    if (!key) return;
    if (!groups.has(key)) groups.set(key, { key, payee, items: [] });
    groups.get(key).items.push(item);
  });
  return [...groups.values()].sort((a, b) => a.payee.localeCompare(b.payee));
}

// Renders the payee summary and its distinct machine suggestions.
function payeeGroupCard(group) {
  const suggestions = [...new Set(group.items.filter(item => item.sBucket || item.sCategory)
    .map(item => [item.sBucket, item.sCategory].filter(Boolean).join(' · ')))];
  const suggestion = suggestions.length
    ? `<span class="payee-suggestion">Suggestion: ${suggestions.map(esc).join(' / ')}</span>`
    : '';
  const amount = group.items.reduce((total, item) => total + (Number(item.amount) || 0), 0);
  return `<button type="button" class="payee-group" data-payee-key="${esc(group.key)}" aria-label="${esc(group.payee)}, ${group.items.length} open rows, ${inr(amount)}${suggestions.length ? ', suggestion ' + esc(suggestions.join(', ')) : ''}">
    <span><span class="payee-name">${esc(group.payee)}</span><span class="payee-count">${group.items.length} open ${group.items.length === 1 ? 'row' : 'rows'}</span></span>
    <span class="payee-total">${inr(amount)}</span>${suggestion}
  </button>`;
}

// Opens one category form for all currently open rows matching a payee.
function openPayeeBulkSheet(key) {
  const group = groupPendingByPayee(items).find(entry => entry.key === key);
  if (!group) return;
  const suggestions = [...new Map(group.items.filter(item => item.sBucket && item.sCategory)
    .map(item => [`${item.sBucket}\u0000${item.sCategory}`, { bucket: item.sBucket, category: item.sCategory }])).values()];
  const suggestion = suggestions.length === 1 ? suggestions[0] : null;
  ctx = { bulkPayeeGroup: group, bucket: suggestion && BUCKETS.includes(suggestion.bucket) ? suggestion.bucket : 'Personal', category: suggestion && CATS.includes(suggestion.category) ? suggestion.category : 'Other' };
  const amount = group.items.reduce((total, item) => total + (Number(item.amount) || 0), 0);
  openSheet(`
    <div class="grip"></div><h3 id="sheetTitle">${esc(group.payee)}</h3>
    <p class="payee-bulk-intro">Set once for ${group.items.length} open ${group.items.length === 1 ? 'row' : 'rows'} · ${inr(amount)} total. This applies to every open row for this payee.</p>
    <div class="label">Bucket</div>
    <div class="seg choice-chips" id="bk" data-choice-group="bucket"></div>
    <div class="label">Category</div>
    <div class="chips choice-chips" id="ct" data-choice-group="category"></div>
    <div class="actions"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="save-payee-group">Apply to all</button></div>`);
  renderChoiceChips($('#bk'));
  renderChoiceChips($('#ct'));
  bindChoiceChips($('#bk'));
  bindChoiceChips($('#ct'));
}

// Saves one bucket/category choice to all open rows for the payee.
async function savePayeeGroup(group, values) {
  try {
    const response = await api('bulkSave', { payeeKey: group.key, bucket: values.bucket, category: values.category });
    if (!Number.isInteger(response.updated) || !Array.isArray(response.refs) || response.refs.length !== response.updated) {
      throw new Error('Invalid bulk save response');
    }
    const refs = new Set(response.refs.map(String));
    const updates = { bucket: values.bucket, category: values.category, status: 'CONFIRMED' };
    await Promise.all([...refs].map(async ref => {
      const historyItem = historyItems.find(item => item.ref === ref);
      const localItem = historyLocalItems.find(item => item.ref === ref);
      const previous = historyItem || localItem;
      if (previous) {
        const before = historySum([previous]);
        Object.assign(previous, updates);
        const after = historySum([previous]);
        Object.keys(historyTotals).forEach(key => { historyTotals[key] += after[key] - before[key]; });
      }
      if (historyItem && localItem && historyItem !== localItem) Object.assign(localItem, updates);
      historyFilterCache.clear();
      await historyUpdateCached(ref, updates);
    }));
    items = items.filter(item => !refs.has(String(item.ref)));
    localStorage.setItem('fin_cache', JSON.stringify({ at: Date.now(), items }));
    if (state.tab === 'pending') renderPending();
    if (state.tab === 'history') renderHistory();
    toast(`Updated ${response.updated} open ${response.updated === 1 ? 'row' : 'rows'}`);
  } catch (error) {
    toast('Not saved: ' + error.message);
  }
}

function groupByDate(entries) {
  const sorted = [...entries].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.time || '').localeCompare(String(a.time || '')));
  const groups = new Map();
  sorted.forEach(item => {
    const date = String(item.date || '');
    if (!groups.has(date)) groups.set(date, []);
    groups.get(date).push(item);
  });
  return [...groups];
}

function card(i) {
  const hasSug = !!i.sBucket;
  const canAccept = hasSug && i.confidence !== 'unsure';
  const credit = i.direction === 'CREDIT';
  const name = i.counterparty || 'Unnamed transaction';
  const pill = i.status === 'PENDING'
    ? '<span class="pill amber">Suggested</span>'
    : '<span class="pill red">Needs review</span>';
  const sug = hasSug
    ? `<span class="sug"><i class="dot ${esc(i.confidence)}"></i>${esc(i.sBucket)} · ${esc(i.sCategory)}${i.sProperty ? ' · ' + esc(i.sProperty) : ''}</span>`
    : '<span class="sug">Choose a category in Edit</span>';
  return `<article class="txn-row">
    <div class="txn-top">
      <div class="txn-icon" aria-hidden="true">${categoryIcon(i)}</div>
      <div class="txn-main">
        <div class="txn-title-row">
          <div class="txn-main"><div class="name">${esc(name)}</div><div class="txn-meta">${esc(i.account || 'Account')}${i.notes ? ' · ' + esc(i.notes) : ''}</div></div>
          <div class="txn-amount"><div class="amt ${credit ? 'in' : ''}">${credit ? '+' : '−'}${inr(i.amount)}</div><div class="txn-direction ${credit ? 'in' : ''}">${credit ? 'Received' : 'Paid'}</div></div>
        </div>
      </div>
    </div>
    <div class="txn-status">${pill}<span class="suggestion-label">${hasSug ? 'Suggested' : 'Category'}:</span>${sug}</div>
    <div class="actions">
      <button class="btn primary" data-act="accept" data-ref="${esc(i.ref)}" ${canAccept ? '' : 'disabled'}>${canAccept ? 'Confirm & save' : 'Edit to categorize'}</button>
      <button class="btn ghost" data-act="edit" data-ref="${esc(i.ref)}">Edit details</button>
    </div>
  </article>`;
}

async function saveItem(item, p) {
  const idx = items.findIndex(entry => entry.ref === item.ref);
  const pendingItem = idx >= 0 ? items[idx] : null;
  if (idx >= 0) {
    items.splice(idx, 1);
    if (state.tab === 'pending') renderPending();
  }
  try {
    await api('save', { ref: item.ref, ...p });
    const updates = { bucket: p.bucket, category: p.category, property: p.property, notes: p.notes, status: 'CONFIRMED' };
    historyFilterCache.clear();
    const cachedItem = historyItems.find(entry => entry.ref === item.ref);
    if (cachedItem) {
      const previous = historySum([cachedItem]);
      Object.assign(cachedItem, updates);
      const current = historySum([cachedItem]);
      Object.keys(historyTotals).forEach(key => { historyTotals[key] += current[key] - previous[key]; });
    }
    const localItem = historyLocalItems.find(entry => entry.ref === item.ref);
    if (localItem && localItem !== cachedItem) Object.assign(localItem, updates);
    await historyUpdateCached(item.ref, updates);
    if (cachedItem && state.tab === 'history') renderHistory();
    toast('Saved · ' + p.category);
  } catch (err) {
    if (pendingItem) {
      items.splice(idx, 0, pendingItem);
      if (state.tab === 'pending') renderPending();
    }
    toast('Not saved: ' + err.message);
  }
}

function openEdit(ref) {
  const item = items.find(x => x.ref === ref) || historyItems.find(x => x.ref === ref);
  if (!item) return;
  ctx = {
    item,
    bucket: item.bucket || item.sBucket || 'Personal',
    category: item.category || item.sCategory || 'Other',
    property: item.property || item.sProperty || '',
    notes: item.notes || ''
  };
  openSheet(`
    <div class="grip"></div>
    <h3 id="sheetTitle">${esc(item.counterparty || 'Transaction')}</h3>
    <div class="meta">${inr(item.amount)} · ${shortDate(item.date)} · ${item.direction === 'CREDIT' ? 'received' : 'paid'}</div>
    <div class="label">Bucket</div>
    <div class="seg choice-chips" id="bk" data-choice-group="bucket"></div>
    <div class="label">Category</div>
    <div class="chips choice-chips" id="ct" data-choice-group="category"></div>
    <label class="label" for="f_prop">Property (unit number)</label>
    <input id="f_prop" inputmode="numeric" value="${esc(ctx.property)}" placeholder="e.g. 170, or leave blank">
    <label class="label" for="f_notes">Notes</label>
    <textarea id="f_notes" rows="2">${esc(ctx.notes)}</textarea>
    <div class="actions">
      <button class="btn ghost" data-act="close">Cancel</button>
      <button class="btn primary" data-act="save-edit">Save & confirm</button>
    </div>`);
  renderChoiceChips($('#bk'));
  renderChoiceChips($('#ct'));
  bindChoiceChips($('#bk'));
  bindChoiceChips($('#ct'));
}

// ---------- Month ----------
async function loadSummary() {
  renderLoading();
  try {
    const r = await api('summary', { month: state.month });
    renderSummary(r.summary);
    setStatus('Month · ' + monthLabel(state.month));
  } catch (e) {
    $('#view').innerHTML = `<div class="empty"><b>Couldn't load the month</b>${esc(e.message)}</div>`;
    setStatus('Not connected');
  }
}

function bars(obj, total, color) {
  const rows = Object.entries(obj).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '<p class="meta">Nothing this month.</p>';
  return rows.map(([k, v]) => `
    <div class="lbl2"><span>${esc(k)}</span><span>${inr(v)}</span></div>
    <div class="bar"><i style="width:${total ? Math.round(v / total * 100) : 0}%;background:${color}"></i></div>`).join('');
}

function renderSummary(s) {
  const bizOut = sumObj(s.business), perOut = sumObj(s.personal);
  const net = s.businessIncome - bizOut;
  $('#view').innerHTML = `
    <div class="page-head month-head">
      <div><h1>${monthLabel(s.month)}</h1><p class="page-description">A clear view of where your money went.</p></div>
      <div class="month-controls">
        <button class="icon" data-month="-1" aria-label="Previous month">‹</button>
        <button class="icon" data-month="1" aria-label="Next month">›</button>
      </div>
    </div>
    <section class="hero" aria-label="Business monthly result">
      <div class="hero-label">Business result</div>
      <div class="amt">${net < 0 ? '−' : ''}${inr(Math.abs(net))}</div>
      <div class="meta">Income minus business spending</div>
      <div class="hero-foot"><span>Income ${inr(s.businessIncome)}</span><span>Business spend ${inr(bizOut)}</span></div>
    </section>
    <div class="grid2 mt" aria-label="Other monthly totals">
      <div class="stat"><div class="meta">Money received</div><div class="amt in">${inr(s.received)}</div></div>
      <div class="stat"><div class="meta">Personal spending</div><div class="amt">${inr(perOut)}</div></div>
    </div>
    <section class="card spend-panel"><div class="section-title"><b>Business spending</b><span>${inr(bizOut)} total</span></div>${bars(s.business, bizOut, 'var(--brand)')}</section>
    <section class="card spend-panel"><div class="section-title"><b>Personal spending</b><span>${inr(perOut)} total</span></div>${bars(s.personal, perOut, 'var(--amber)')}</section>
    <div class="grid2 mt">
      <div class="stat"><div class="meta">Transfers between accounts</div><div class="amt">${inr(s.internal)}</div></div>
      <div class="stat"><div class="meta">Waiting for review</div><div class="amt">${s.pendingCount}</div></div>
    </div>`;
}

function shiftMonth(n) {
  const [y, m] = state.month.split('-').map(Number);
  state.month = ymd(new Date(y, m - 1 + n, 1));
  loadSummary();
}

// ---------- Payment history ----------
const HISTORY_PAGE_SIZE = 40;
const HISTORY_DB_NAME = 'fin-cache';
const HISTORY_DB_VERSION = 1;
const HISTORY_FILTERS = [['all', 'All'], ['sent', 'Sent'], ['received', 'Received'], ['business', 'Business'], ['personal', 'Personal'], ['pending', 'Pending']];
const HISTORY_COLORS = ['#1177cc', '#148254', '#b6342c', '#9a5c08', '#7b55a1', '#147e87', '#c05a82', '#64748b', '#a16b20', '#3b72a8', '#53804b', '#855e9b', '#bd6b35', '#357b8f', '#9b4d57', '#5d786a', '#6e70a8'];
let historyItems = [];
let historyLocalItems = [];
let historyLiveItems = [];
let historyLiveOffset = 0;
let historyLiveRange = null;
let historyLiveAll = false;
let historyLiveHasMore = false;
let historyLiveComplete = false;
let historyHasLive = false;
let historyTotals = { sent: 0, received: 0, business: 0, personal: 0, internal: 0 };
let historyLoading = false;
let historyAppendLoading = false;
let historyRequestId = 0;
let historySnapshotPromise = null;
let historySnapshotFailed = false;
let historySnapshotAt = 0;
let historyOffline = false;
let historyDbPromise = null;
let historyFilterCache = new Map();
let historyObserver = null;

// Returns the inclusive date range represented by a month key.
function monthRange(month) {
  const [year, monthNumber] = month.split('-').map(Number);
  const lastDay = new Date(year, monthNumber, 0).getDate();
  return { from: `${month}-01`, to: `${month}-${String(lastDay).padStart(2, '0')}` };
}


// Formats a local calendar date without converting it through UTC.
function historyDateKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

// Builds one named date period using local calendar dates.
function historyPeriodFor(preset) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayKey = historyDateKey(today);
  if (preset === 'all-time') return null;
  if (preset === 'this-month') {
    const month = ymd(today);
    return { ...monthRange(month), label: monthLabel(month) };
  }
  if (preset === 'last-month') {
    const month = ymd(new Date(today.getFullYear(), today.getMonth() - 1, 1));
    return { ...monthRange(month), label: monthLabel(month) };
  }
  if (preset === 'this-year') return { from: `${today.getFullYear()}-01-01`, to: todayKey, label: `This year · ${today.getFullYear()}` };
  if (preset === 'last-30' || preset === 'last-90') {
    const from = new Date(today);
    from.setDate(from.getDate() - (preset === 'last-30' ? 29 : 89));
    return { from: historyDateKey(from), to: todayKey, label: preset === 'last-30' ? 'Last 30 days' : 'Last 90 days' };
  }
  const month = String(preset || '');
  if (/^\d{4}-\d{2}$/.test(month)) return { ...monthRange(month), label: monthLabel(month) };
  return null;
}

// Opens the date sheet with presets, recent months, and custom range fields.
function openHistoryDateSheet() {
  const today = new Date();
  const months = Array.from({ length: 18 }, (_, index) => ymd(new Date(today.getFullYear(), today.getMonth() - index, 1)));
  const presets = [['this-month', 'This month'], ['last-month', 'Last month'], ['last-30', 'Last 30 days'], ['last-90', 'Last 90 days'], ['this-year', 'This year'], ['all-time', 'All time']];
  const from = state.historyPeriod ? state.historyPeriod.from : '';
  const to = state.historyPeriod ? state.historyPeriod.to : '';
  openSheet(`
    <div class="grip"></div><h3 id="sheetTitle">Choose dates</h3>
    <div class="history-date-presets" aria-label="Date presets">${presets.map(([value, label]) => `<button class="history-date-option" data-history-preset="${value}">${label}</button>`).join('')}</div>
    <div class="label">Recent months</div>
    <div class="history-date-months">${months.map(month => `<button class="history-date-option" data-history-month="${month}">${esc(monthLabel(month))}</button>`).join('')}</div>
    <div class="label">Custom range</div>
    <div class="history-date-fields"><div><label class="label" for="historyFrom">From</label><input id="historyFrom" type="date" value="${esc(from)}"></div><div><label class="label" for="historyTo">To</label><input id="historyTo" type="date" value="${esc(to)}"></div></div>
    <div class="actions"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="history-apply-range">Apply</button></div>`);
}

// Returns whether a date input contains a real local calendar date.
function validHistoryDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const date = new Date(`${value}T00:00:00`);
  return !Number.isNaN(date.getTime()) && historyDateKey(date) === value;
}

// Clips a selected period to the latest date supported by the local calendar.
function historyRangeThroughToday(range, today) {
  const to = range.to < today ? range.to : today;
  return range.from <= to ? { from: range.from, to } : null;
}

// Returns the rolling ten-calendar-day cache window ending today.
function historyWindow() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const from = new Date(today);
  from.setDate(from.getDate() - 9);
  const format = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  return { from: format(from), to: format(today) };
}

// Opens the IndexedDB stores and resolves null when browser storage is unavailable.
function openHistoryDb() {
  if (!('indexedDB' in window)) return Promise.resolve(null);
  if (historyDbPromise) return historyDbPromise;
  historyDbPromise = new Promise(resolve => {
    let request;
    try { request = indexedDB.open(HISTORY_DB_NAME, HISTORY_DB_VERSION); }
    catch (_) { resolve(null); return; }
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains('txns')) {
        const store = db.createObjectStore('txns', { keyPath: 'ref' });
        store.createIndex('stamp', 'stamp', { unique: false });
      }
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => resolve(null);
    request.onblocked = () => resolve(null);
  });
  return historyDbPromise;
}

// Converts an IndexedDB request into a promise for its result.
function historyRequest(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('History storage request failed'));
  });
}

// Resolves when an IndexedDB transaction commits and rejects on abort or error.
function historyTransactionDone(transaction) {
  return new Promise((resolve, reject) => {
    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error || new Error('History storage transaction failed'));
    transaction.onabort = () => reject(transaction.error || new Error('History storage transaction aborted'));
  });
}

// Reads and normalizes a date-bounded range using the stamp index.
async function historyReadRange(from, to) {
  const db = await openHistoryDb();
  if (!db || from > to) return null;
  try {
    const transaction = db.transaction('txns', 'readonly');
    const done = historyTransactionDone(transaction);
    const range = IDBKeyRange.bound(from, `${to}\uffff`);
    const request = transaction.objectStore('txns').index('stamp').getAll(range);
    const rows = await historyRequest(request);
    await done;
    return rows.map(normalizeHistoryItem);
  } catch (_) {
    return null;
  }
}

// Reads the last successful snapshot time from IndexedDB metadata.
async function historyReadSnapshotTime() {
  const db = await openHistoryDb();
  if (!db) return 0;
  try {
    const transaction = db.transaction('meta', 'readonly');
    const done = historyTransactionDone(transaction);
    const record = await historyRequest(transaction.objectStore('meta').get('snapshot'));
    await done;
    return Number(record && record.at) || 0;
  } catch (_) {
    return 0;
  }
}

// Deletes cached transactions outside the current rolling date window.
async function historyTrimCache(from, to) {
  const db = await openHistoryDb();
  if (!db) return false;
  try {
    const transaction = db.transaction('txns', 'readwrite');
    const done = historyTransactionDone(transaction);
    const request = transaction.objectStore('txns').openCursor();
    request.onsuccess = event => {
      const cursor = event.target.result;
      if (!cursor) return;
      const date = String(cursor.value.stamp || '').slice(0, 10);
      if (date < from || date > to) cursor.delete();
      cursor.continue();
    };
    request.onerror = () => transaction.abort();
    await done;
    return true;
  } catch (_) {
    return false;
  }
}

// Replaces the cached rolling window and records its successful snapshot time atomically.
async function historyReplaceCache(items, from, to, at) {
  const db = await openHistoryDb();
  if (!db) return false;
  try {
    const transaction = db.transaction(['txns', 'meta'], 'readwrite');
    const done = historyTransactionDone(transaction);
    const txns = transaction.objectStore('txns');
    txns.clear();
    items.forEach(item => {
      const normalized = normalizeHistoryItem(item);
      if (normalized.date >= from && normalized.date <= to) txns.put(normalized);
    });
    transaction.objectStore('meta').put({ key: 'snapshot', at });
    await done;
    return true;
  } catch (_) {
    return false;
  }
}

// Updates an already cached transaction after the server confirms a save.
async function historyUpdateCached(ref, updates) {
  const db = await openHistoryDb();
  if (!db) return false;
  try {
    const transaction = db.transaction('txns', 'readwrite');
    const done = historyTransactionDone(transaction);
    const request = transaction.objectStore('txns').get(ref);
    const found = await new Promise((resolve, reject) => {
      request.onsuccess = () => {
        if (request.result) transaction.objectStore('txns').put({ ...request.result, ...updates });
        resolve(!!request.result);
      };
      request.onerror = () => reject(request.error || new Error('History storage request failed'));
    });
    await done;
    return found;
  } catch (_) {
    return false;
  }
}

// Validates and selects only supported transaction fields from an API item.
function normalizeHistoryItem(item) {
  if (!item || typeof item !== 'object') throw new Error('Invalid transaction');
  const stamp = String(item.stamp || item.date || '');
  const date = String(item.date || stamp.slice(0, 10));
  const time = stamp.length > 10 ? stamp.slice(11, 16) : '';
  const direction = String(item.direction || '').toUpperCase();
  const amount = Number(item.amount);
  const ref = String(item.ref || '');
  if (!ref || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !['DEBIT', 'CREDIT'].includes(direction) || !Number.isFinite(amount)) {
    throw new Error('Invalid transaction');
  }
  return {
    ref, stamp, date, time, direction, amount: Math.abs(amount),
    counterparty: String(item.counterparty || ''), source: String(item.source || ''),
    account: String(item.account || ''), status: String(item.status || ''),
    bucket: String(item.bucket || ''), category: String(item.category || ''),
    property: String(item.property || ''), notes: String(item.notes || '')
  };
}

// Computes local History totals with transfers excluded from Sent and Received.
function historySum(items) {
  const totals = { sent: 0, received: 0, business: 0, personal: 0, internal: 0 };
  items.forEach(item => {
    const bucket = String(item.bucket || '').toLowerCase();
    if (bucket === 'internal') totals.internal += item.amount;
    else if (item.direction === 'DEBIT') totals.sent += item.amount;
    else if (item.direction === 'CREDIT') totals.received += item.amount;
    if (item.direction === 'DEBIT' && bucket === 'business') totals.business += item.amount;
    if (item.direction === 'DEBIT' && bucket === 'personal') totals.personal += item.amount;
  });
  return totals;
}

// Formats an epoch time for the shared status line.
function historyTimeLabel(at) {
  return new Date(at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

// Refreshes the rolling snapshot without blocking Pending or the visible History list.
async function refreshHistorySnapshot() {
  if (!cfg().key || !('indexedDB' in window) || historySnapshotPromise) return historySnapshotPromise;
  historySnapshotFailed = false;
  historySnapshotPromise = (async () => {
    const db = await openHistoryDb();
    if (!db) return;
    const range = historyWindow();
    await historyTrimCache(range.from, range.to);
    try {
      const response = await api('snapshot', range);
      if (!Array.isArray(response.items)) throw new Error('Invalid snapshot response');
      const rows = response.items.map(normalizeHistoryItem);
      if (rows.some(item => item.date < range.from || item.date > range.to)) throw new Error('Snapshot outside requested range');
      const at = Date.now();
      if (!await historyReplaceCache(rows, range.from, range.to, at)) throw new Error('History storage unavailable');
      historySnapshotAt = at;
      historySnapshotFailed = false;
      historyOffline = false;
      if (state.tab === 'history') await loadHistory();
      setStatus('Updated ' + historyTimeLabel(at));
    } catch (_) {
      historySnapshotFailed = true;
      historyOffline = true;
      if (state.tab === 'history') {
        await loadHistory();
        if (historyOffline && historyItems.length) setStatus('Offline · showing saved list' + (historySnapshotAt ? ' · updated ' + historyTimeLabel(historySnapshotAt) : ''));
      }
    }
  })();
  try { await historySnapshotPromise; }
  finally { historySnapshotPromise = null; }
}

// Splits a selected range into its locally cached portion and older live portion.
function splitHistoryRange(requested, windowRange) {
  const today = windowRange.to;
  const to = requested.to > today ? today : requested.to;
  if (requested.from > to) return { local: null, live: null };
  const localFrom = requested.from > windowRange.from ? requested.from : windowRange.from;
  const localTo = to < windowRange.to ? to : windowRange.to;
  const local = localFrom <= localTo ? { from: localFrom, to: localTo } : null;
  const cutoff = new Date(windowRange.from + 'T00:00:00');
  cutoff.setDate(cutoff.getDate() - 1);
  const liveTo = `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, '0')}-${String(cutoff.getDate()).padStart(2, '0')}`;
  const live = requested.from < windowRange.from ? { from: requested.from, to: to < liveTo ? to : liveTo } : null;
  return { local, live: live && live.from <= live.to ? live : null };
}

// Loads the selected local date range first, then pages any older live results.
async function loadHistory(append = false) {
  if (append && (historyLoading || historyAppendLoading || !historyLiveHasMore)) return;
  const requestId = append ? historyRequestId : ++historyRequestId;
  const cacheStartedAt = performance.now();
  if (!append) {
    historyDebug = { cachePaintMs: null, networkMs: null, serverMs: null };
    renderApiDebug();
    historyFilterCache.clear();
    historyLoading = true;
    historyAppendLoading = false;
    historyLiveItems = [];
    historyLiveOffset = 0;
    historyHasLive = false;
    historyLiveRange = null;
    historyLiveAll = !state.historyPeriod;
    historyLiveHasMore = historyLiveAll;
    historyLiveComplete = !historyLiveHasMore;
  } else historyAppendLoading = true;

  let failure = null;
  try {
    if (!append) {
      const db = await openHistoryDb();
      const windowRange = historyWindow();
      const requested = state.historyPeriod;
      const selected = requested ? splitHistoryRange(requested, windowRange) : { local: windowRange, live: null };
      let localRows = db && selected.local ? await historyReadRange(selected.local.from, selected.local.to) : null;
      if (!Array.isArray(localRows)) localRows = [];
      if (requestId !== historyRequestId) return;
      historyLocalItems = localRows;
      historyItems = localRows.slice();
      historyTotals = historySum(localRows);
      historyLiveRange = db ? selected.live : (requested ? historyRangeThroughToday(requested, windowRange.to) : null);
      const snapshotAt = await historyReadSnapshotTime();
      if (snapshotAt) historySnapshotAt = snapshotAt;
      if (historySnapshotPromise && !historySnapshotFailed && !localRows.length && selected.local && !historyLiveAll) {
        historyLoading = false;
        renderHistory();
        return;
      }
      if (localRows.length) {
        setStatus(historySnapshotPromise ? 'Showing saved list · updating…' : 'Showing saved list · updated ' + (historySnapshotAt ? historyTimeLabel(historySnapshotAt) : 'recently'));
      } else if (!historyLiveAll && !historyLiveRange && historySnapshotPromise) {
        setStatus('Showing saved list · updating…');
        renderHistory();
        return;
      }
      if (requested && !historyLiveRange && !localRows.length && !snapshotAt && db) {
        historyLiveRange = historyRangeThroughToday(requested, windowRange.to);
      }
      historyLiveHasMore = historyLiveAll || !!historyLiveRange;
      historyLiveComplete = !historyLiveHasMore;
      renderHistory();
      if (db && selected.local) recordHistoryCachePaint(cacheStartedAt, requestId);
      if (!historyLiveAll && !historyLiveRange) {
        historyLoading = false;
        historyLiveComplete = true;
        renderHistory();
        return;
      }
    }

    const liveRange = historyLiveRange;
    if (!historyLiveAll && !liveRange) return;
    const params = { status: 'all', q: '', offset: historyLiveOffset, limit: HISTORY_PAGE_SIZE };
    if (!historyLiveAll) Object.assign(params, liveRange);
    const networkStartedAt = performance.now();
    let response;
    try { response = await api('history', params); }
    finally {
      if (requestId === historyRequestId) {
        historyDebug.networkMs = performance.now() - networkStartedAt;
        renderApiDebug();
      }
    }
    if (requestId === historyRequestId) {
      historyDebug.serverMs = Number.isFinite(response.serverMs) ? response.serverMs : null;
      renderApiDebug();
    }
    if (!Array.isArray(response.items) || typeof response.hasMore !== 'boolean') throw new Error('Invalid history response');
    const received = response.items.map(normalizeHistoryItem);
    historyFilterCache.clear();
    if (received.length > HISTORY_PAGE_SIZE || (response.hasMore && received.length === 0)) throw new Error('Incomplete history page');
    if (requestId !== historyRequestId) return;
    const serverRefs = new Set(received.map(item => item.ref));
    historyLocalItems = historyLocalItems.filter(item => !serverRefs.has(item.ref));
    const knownRefs = new Set(historyLiveItems.map(item => item.ref));
    received.forEach(item => {
      if (!knownRefs.has(item.ref)) { historyLiveItems.push(item); knownRefs.add(item.ref); }
    });
    const firstPage = historyLiveOffset === 0;
    historyLiveOffset += received.length;
    historyLiveHasMore = response.hasMore;
    historyLiveComplete = !response.hasMore;
    historyHasLive = historyHasLive || received.length > 0;
    historyItems = historyLocalItems.concat(historyLiveItems).sort((a, b) => b.stamp.localeCompare(a.stamp) || b.ref.localeCompare(a.ref));
    const totalKeys = ['sent', 'received', 'business', 'personal', 'internal'];
    if (firstPage && response.totals && totalKeys.every(key => Number.isFinite(Number(response.totals[key])))) {
      const localTotals = historyLiveAll ? { sent: 0, received: 0, business: 0, personal: 0, internal: 0 } : historySum(historyLocalItems);
      historyTotals = Object.fromEntries(totalKeys.map(key => [key, localTotals[key] + Number(response.totals[key])]));
    } else if (firstPage) historyTotals = historySum(historyItems);
    historyOffline = false;
  } catch (error) {
    if (requestId === historyRequestId) failure = error;
  } finally {
    if (requestId === historyRequestId) { historyLoading = false; historyAppendLoading = false; }
  }

  if (requestId !== historyRequestId || state.tab !== 'history') return;
  if (failure) {
    historyOffline = true;
    if (historyItems.length) setStatus('Offline · showing saved list' + (historySnapshotAt ? ' · updated ' + historyTimeLabel(historySnapshotAt) : ''));
    else setStatus('Not connected');
    if (!historyItems.length && !historyLocalItems.length) {
      $('#view').innerHTML = `<div class="empty"><b>Payment history unavailable</b><p>${esc(failure.message)}</p><button class="btn primary" data-act="history-retry">Try again</button></div>`;
    } else if (append) renderHistoryList();
    else renderHistory();
    return;
  }
  if (historyHasLive) setStatus(historyItems.length ? 'History · live and saved' : 'History · live');
  else setStatus('Showing saved list · updated ' + (historySnapshotAt ? historyTimeLabel(historySnapshotAt) : historyTimeLabel(Date.now())));
  if (append) renderHistoryList();
  else renderHistory();
}
// Records the first rendered local-cache frame for the current History request.
function recordHistoryCachePaint(startedAt, requestId) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (requestId !== historyRequestId) return;
    historyDebug.cachePaintMs = performance.now() - startedAt;
    renderApiDebug();
  }));
}

// Builds History with its date chip, active-period totals, filters, and search.
function renderHistory() {
  const rangeLabel = state.historyPeriod ? state.historyPeriod.label : 'All dates';
  $('#view').innerHTML = `
    <div class="page-head">
      <div><h1>History${historyHasLive ? '<span class="history-live">Live</span>' : ''}</h1></div>
      <div class="history-date-control"><button type="button" class="history-date-chip" data-act="history-dates" aria-label="Choose date range"><span>${esc(rangeLabel)}</span><span aria-hidden="true">⌄</span></button>${state.historyPeriod ? '<button type="button" class="history-date-clear" data-act="history-reset-date" aria-label="Clear date range">×</button>' : ''}</div>
    </div>
    <section class="history-totals" aria-label="Transaction totals for ${esc(rangeLabel)}">
      <div class="history-total"><span>Sent</span><strong>−${inr(historyTotals.sent)}</strong></div>
      <div class="history-total"><span>Received</span><strong class="in">+${inr(historyTotals.received)}</strong></div>
    </section>
    <div class="history-breakdown">Business ${inr(historyTotals.business)} <span aria-hidden="true">·</span> Personal ${inr(historyTotals.personal)}</div>
    <div class="history-internal">Moved between your accounts ${inr(historyTotals.internal)}</div>
    <div class="history-chips" id="historyTypeFilters" role="group" aria-label="Filter payment history"></div>
    <input class="search history-search" id="historySearch" type="search" aria-label="Search payment history" placeholder="Search payee, bank, category or amount" value="${esc(state.historyQuery)}">
    <div id="historyList" aria-live="polite"></div>`;
  const filters = $('#historyTypeFilters');
  renderHistoryFilters(filters);
  filters.addEventListener('click', event => {
    const button = event.target.closest('button[data-value]');
    if (!button || !filters.contains(button)) return;
    state.historyFilter = button.dataset.value;
    renderHistoryFilters(filters);
    renderHistoryList();
  });
  $('#historySearch').addEventListener('input', event => { state.historyQuery = event.target.value; renderHistoryList(); });
  renderHistoryList();
}

// Draws History filter chips from the active filter state.
function renderHistoryFilters(container) {
  container.innerHTML = HISTORY_FILTERS.map(([value, label]) => `<button type="button" class="history-chip ${state.historyFilter === value ? 'on' : ''}" data-value="${esc(value)}" aria-pressed="${state.historyFilter === value}">${esc(label)}</button>`).join('');
}

// Filters and searches every currently loaded recent or live item in the browser.
function filteredHistoryItems() {
  const query = state.historyQuery.trim().toLowerCase();
  const key = `${state.historyPeriod ? state.historyPeriod.from + ':' + state.historyPeriod.to : 'all'}:${state.historyFilter}`;
  if (!query && historyFilterCache.has(key)) return historyFilterCache.get(key);
  const filtered = historyItems.filter(item => {
    if (state.historyFilter === 'sent' && item.direction !== 'DEBIT') return false;
    if (state.historyFilter === 'received' && item.direction !== 'CREDIT') return false;
    if (state.historyFilter === 'business' && item.bucket.toLowerCase() !== 'business') return false;
    if (state.historyFilter === 'personal' && item.bucket.toLowerCase() !== 'personal') return false;
    if (state.historyFilter === 'pending' && item.status !== 'PENDING' && item.status !== 'NEEDS REVIEW') return false;
    if (!query) return true;
    return [item.counterparty, item.source, item.account, item.status, item.bucket,
      item.category, item.property, item.notes, item.amount, item.ref].join(' ').toLowerCase().includes(query);
  });
  if (!query) historyFilterCache.set(key, filtered);
  return filtered;
}

// Renders month or day groups, net totals, and live paging status.
function renderHistoryList() {
  const list = $('#historyList');
  if (!list) return;
  if (historyObserver) { historyObserver.disconnect(); historyObserver = null; }
  const visible = filteredHistoryItems();
  let content = '';
  if (!historyItems.length && (historyLoading || historyAppendLoading)) {
    content = '<div class="history-state" role="status">Loading…</div>';
  } else if (!historyItems.length) {
    content = '<div class="empty"><b>No transactions in this period</b><button class="btn primary history-empty-button" data-act="history-dates">Change dates</button></div>';
  } else if (visible.length) {
    const renderDay = ([date, dayItems]) => {
      const net = historyNet(dayItems);
      const netText = `${net > 0 ? '+' : net < 0 ? '−' : ''}${inr(Math.abs(net))}`;
      return `<section class="day-group" aria-label="${esc(dayHeading(date))}">
        <div class="day-heading"><h2>${esc(dayHeading(date))}</h2><span class="history-day-net ${net > 0 ? 'positive' : ''}">${netText}</span></div>
        <div class="day-list">${dayItems.map(historyRow).join('')}</div>
      </section>`;
    };
    if (!state.historyPeriod) {
      content = groupByMonth(visible).map(([month, monthItems]) => {
        const net = historyNet(monthItems);
        const netText = `${net > 0 ? '+' : net < 0 ? '−' : ''}${inr(Math.abs(net))}`;
        return `<section class="history-month-group"><div class="history-month-heading"><h2>${esc(monthLabel(month))}</h2><span>${netText}</span></div>${groupByDate(monthItems).map(renderDay).join('')}</section>`;
      }).join('');
    } else content = groupByDate(visible).map(renderDay).join('');
  } else {
    content = '<div class="empty"><b>No transactions match</b>Try another filter or search.</div>';
  }
  const footer = historyAppendLoading
    ? '<div class="history-state" role="status">Loading…</div>'
    : historyLiveHasMore
      ? ('IntersectionObserver' in window
        ? '<div id="historySentinel" class="history-state" role="status">Scroll for older transactions</div>'
        : '<button class="link" data-act="history-more">Load older transactions</button>')
      : historyLiveComplete ? '<div class="history-state">End of history</div>' : '';
  list.innerHTML = content + footer;
  const sentinel = $('#historySentinel');
  if (sentinel) {
    historyObserver = new IntersectionObserver(entries => {
      if (entries.some(entry => entry.isIntersecting)) loadHistory(true);
    }, { rootMargin: '200px' });
    historyObserver.observe(sentinel);
  }
}

// Groups transactions by their local calendar month in newest-first order.
function groupByMonth(entries) {
  const groups = new Map();
  [...entries].sort((a, b) => String(b.stamp || b.date).localeCompare(String(a.stamp || a.date))).forEach(item => {
    const month = String(item.date || item.stamp || '').slice(0, 7);
    if (!groups.has(month)) groups.set(month, []);
    groups.get(month).push(item);
  });
  return [...groups];
}

// Calculates a net while leaving internal transfers out of the result.
function historyNet(items) {
  return items.reduce((sum, item) => {
    if (String(item.bucket || '').toLowerCase() === 'internal') return sum;
    return sum + (item.direction === 'CREDIT' ? item.amount : -item.amount);
  }, 0);
}

// Returns a stable category color for the transaction avatar.
function historyCategoryColor(category) {
  const index = CATS.indexOf(String(category || 'Other'));
  return HISTORY_COLORS[index < 0 ? HISTORY_COLORS.length - 1 : index % HISTORY_COLORS.length];
}

// Returns up to two initials for a counterparty avatar.
function historyInitials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase() || '?';
}

// Renders one history item with escaped server text and explicit debit/credit semantics.
function historyRow(item) {
  const credit = item.direction === 'CREDIT';
  const name = item.counterparty || 'Unnamed transaction';
  const category = item.category || 'Uncategorized';
  const stamp = String(item.stamp || '');
  const stampedTime = stamp.length > 10 ? stamp.slice(11, 16) : '';
  const time = stampedTime && stampedTime !== '00:00' ? ` · ${esc(stampedTime)}` : '';
  const pending = item.status === 'PENDING' || item.status === 'NEEDS REVIEW';
  const color = historyCategoryColor(item.category);
  return `<button type="button" class="history-row" data-history-ref="${esc(item.ref)}" aria-label="${pending ? 'Pending review. ' : ''}${credit ? 'Received' : 'Paid'} ${inr(item.amount)} ${esc(name)}${time}">
    <span class="history-avatar" style="--avatar-color:${color}" aria-hidden="true">${esc(historyInitials(name))}</span>
    <span class="history-copy"><span class="history-title">${esc(name)}${pending ? '<i class="history-pending-dot" aria-hidden="true"></i>' : ''}</span><span class="history-meta">${esc(category)}${time}</span></span>
    <span class="history-amount"><span class="amt ${credit ? 'in' : ''}">${credit ? '+' : '−'}${inr(item.amount)}</span></span>
  </button>`;
}

// Opens the detail sheet, including a reference to the shared transaction editor.
function openHistoryDetail(ref) {
  const item = historyItems.find(entry => entry.ref === ref);
  if (!item) return;
  const credit = item.direction === 'CREDIT';
  const detail = (label, value, extraClass = '') => `<div class="${extraClass}"><dt>${label}</dt><dd>${esc(value || '—')}</dd></div>`;
  openSheet(`
    <div class="grip"></div>
    <div class="setup-head"><div class="setup-mark" aria-hidden="true">${credit ? '↓' : '↑'}</div><div><h3 id="sheetTitle">${esc(item.counterparty || 'Transaction')}</h3><div class="meta">${credit ? 'Received' : 'Paid'} · ${esc(fmtStamp(item.stamp))}</div></div></div>
    <div class="history-detail" role="group" aria-label="Transaction details">
      ${detail('Amount', `${credit ? '+' : '−'}${inr(item.amount)}`)}
      ${detail('Status', item.status)}
      ${detail('Date and time', fmtStamp(item.stamp))}
      ${detail('Counterparty', item.counterparty)}
      ${detail('Account', item.account)}
      ${detail('Source', item.source)}
      ${detail('Bucket', item.bucket)}
      ${detail('Category', item.category)}
      ${detail('Property', item.property)}
      ${detail('Notes', item.notes)}
      ${detail('Reference', item.ref, 'history-reference')}
    </div>
    <div class="actions"><button class="btn ghost" data-act="close">Close</button><button class="btn primary" data-act="edit" data-ref="${esc(item.ref)}">Edit</button></div>`);
}

// ---------- Settings ----------
function openSettings() {
  const c = cfg();
  openSheet(`
    <div class="grip"></div>
    <div class="setup-head"><div class="setup-mark" aria-hidden="true">↗</div><div><h3 id="sheetTitle">Connect your sheet</h3><div class="meta">A quick one-time setup</div></div></div>
    <p class="setup-copy">Enter your app key (APP_KEY) so pending transactions and monthly totals can sync with Google Sheets.</p>
    <label class="label" for="s_url">Backend URL</label>
    <input id="s_url" type="url" value="${esc(c.url || '')}" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="label" for="s_key">App key</label>
    <input id="s_key" type="password" value="${esc(c.key || '')}" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="Enter your key">
    <div class="secure-note"><span aria-hidden="true">🔒</span><span><b>Your key stays on this device.</b> It is saved in this browser, not in the app’s source code.</span></div>
    <div class="settings-actions">
      <button class="btn ghost" data-act="test">Check connection</button>
      <button class="btn primary" data-act="save-settings">Save settings</button>
    </div>
    ${c.key ? '<button class="link" data-act="close">Cancel</button>' : ''}`);
}

function writeSettings() {
  localStorage.setItem('fin_cfg', JSON.stringify({ url: $('#s_url').value.trim(), key: $('#s_key').value.trim() }));
}

// ---------- Actions (one click handler for the whole app) ----------
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-tab],[data-filter],[data-pending-view],[data-payee-key],[data-month],[data-history-ref],[data-history-preset],[data-history-month]');
  if (!el) return;

  if (el.dataset.tab) {
    state.tab = el.dataset.tab;
    $('#tabPending').classList.toggle('on', state.tab === 'pending');
    $('#tabPending').setAttribute('aria-pressed', String(state.tab === 'pending'));
    $('#tabMonth').classList.toggle('on', state.tab === 'month');
    $('#tabMonth').setAttribute('aria-pressed', String(state.tab === 'month'));
    $('#tabHistory').classList.toggle('on', state.tab === 'history');
    $('#tabHistory').setAttribute('aria-pressed', String(state.tab === 'history'));
    if (state.tab === 'pending') loadPending();
    else if (state.tab === 'history') loadHistory();
    else loadSummary();
    return;
  }
  if (el.dataset.pendingView) { state.pendingView = el.dataset.pendingView; pendingVisibleCount = 40; renderPendingControls(); renderList(); return; }
  if (el.dataset.payeeKey) { openPayeeBulkSheet(el.dataset.payeeKey); return; }
  if (el.dataset.historyPreset) { state.historyPeriod = historyPeriodFor(el.dataset.historyPreset); closeSheet(); loadHistory(); return; }
  if (el.dataset.historyMonth) { state.historyPeriod = historyPeriodFor(el.dataset.historyMonth); closeSheet(); loadHistory(); return; }
  if (el.dataset.historyRef) { openHistoryDetail(el.dataset.historyRef); return; }
  if (el.dataset.filter) { state.filter = el.dataset.filter; pendingVisibleCount = 40; renderPendingControls(); renderList(); return; }
  if (el.dataset.month) { shiftMonth(Number(el.dataset.month)); return; }

  switch (el.dataset.act) {
    case 'save-payee-group': {
      const group = ctx && ctx.bulkPayeeGroup;
      if (!group || !BUCKETS.includes(ctx.bucket) || !CATS.includes(ctx.category)) { toast('Choose a bucket and category first'); return; }
      closeSheet();
      await savePayeeGroup(group, { bucket: ctx.bucket, category: ctx.category });
      break;
    }
    case 'history-dates': openHistoryDateSheet(); break;
    case 'history-reset-date': state.historyPeriod = null; loadHistory(); break;
    case 'history-apply-range': {
      const from = $('#historyFrom').value, to = $('#historyTo').value;
      if (!validHistoryDate(from) || !validHistoryDate(to) || from > to) { toast('Choose a valid date range'); return; }
      state.historyPeriod = { from, to, label: `${new Date(from + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })} – ${new Date(to + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}` };
      closeSheet(); loadHistory(); break;
    }
    case 'history-more': loadHistory(true); break;
    case 'pending-more': pendingVisibleCount += 40; renderList(); break;
    case 'history-retry': loadHistory(); break;
    case 'accept': {
      const item = items.find(x => x.ref === el.dataset.ref);
      if (item && item.sBucket) {
        saveItem(item, { bucket: item.sBucket, category: item.sCategory, property: item.sProperty || '', notes: item.notes || '' });
      }
      break;
    }
    case 'edit': openEdit(el.dataset.ref); break;
    case 'save-edit': {
      const p = {
        bucket: ctx.bucket,
        category: ctx.category,
        property: $('#f_prop').value.trim(),
        notes: $('#f_notes').value.trim()
      };
      if (!CATS.includes(p.category)) { toast('Choose a category first'); return; }
      const item = ctx.item;
      closeSheet();
      saveItem(item, p);
      break;
    }
    case 'close': closeSheet(); break;
    case 'settings': openSettings(); break;
    case 'save-settings':
      writeSettings(); closeSheet(); toast('Saved'); refresh(); break;
    case 'test':
      writeSettings();
      try {
        const r = await api('pending');
        toast(`Connected · ${r.items.length} open item(s)`);
      } catch (err) {
        toast('Failed: ' + err.message);
      }
      break;
  }
});

function refresh() {
  refreshHistorySnapshot();
  if (state.tab === 'pending') loadPending();
  else if (state.tab === 'history') loadHistory();
  else loadSummary();
}
$('#btnRefresh').onclick = refresh;
$('#btnSettings').onclick = openSettings;

// ---------- Start ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (!cfg().key) { setStatus('Setup required'); openSettings(); }
else { loadPending(); refreshHistorySnapshot(); }
</script>
</body>
</html>
