<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Finance</title>
<style>
:root{--bg:#f2f3f7;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--chip:#eef2ff;--chip-ink:#3730a3;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05)}
@media (prefers-color-scheme: dark){:root{--bg:#0b1020;--card:#151c2e;--ink:#e5e9f5;--muted:#94a3b8;--line:#243049;--chip:#1e2a4a;--chip-ink:#c7d2fe;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted)}
.grow{flex:1}
.icon{width:38px;height:38px;border-radius:12px;border:0;background:var(--card);color:var(--ink);font-size:18px;box-shadow:var(--shadow)}
main{padding:12px 14px 20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
.tab{flex:1;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px}
.tab .ti{font-size:20px;line-height:1}
.tab.on{color:var(--brand)}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.mt{margin-top:10px}
.name{font-weight:650;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:var(--muted)}
.amt{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--green)}
.who{min-width:0;flex:1;padding-right:8px}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.pill.amber{background:#fef3c7;color:#92400e}
.pill.red{background:#fee2e2;color:#991b1b}
@media (prefers-color-scheme: dark){.pill.amber{background:#3b2a0a;color:#fcd34d}.pill.red{background:#3b1313;color:#fca5a5}}
.sug{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.high{background:var(--green)}
.dot.medium{background:var(--amber)}
.dot.unsure{background:var(--red)}
.dot.rule{background:var(--brand)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{border:0;border-radius:14px;padding:13px 10px;font-size:15px;font-weight:650}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--chip);color:var(--chip-ink)}
.btn:disabled{opacity:.35}
.btn:active{transform:scale(.98)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--shadow);gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--brand);color:#fff}
.search{width:100%;margin:10px 0 12px;padding:12px 14px;border-radius:14px;border:0;background:var(--card);color:var(--ink);font-size:16px;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.label{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
input,textarea{width:100%;padding:13px 14px;font-size:16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.4);display:none;align-items:flex-end;z-index:9}
.scrim.on{display:flex}
.sheet{width:100%;max-height:88vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grip{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 2px;font-size:19px}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px}
.lbl2{display:flex;justify-content:space-between;font-size:14px;margin-top:12px}
.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.hero .meta{color:rgba(255,255,255,.85)}
.hero .amt{font-size:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat .amt{font-size:18px;margin-top:4px}
.skel{height:120px;border-radius:18px;background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:#0f172a;color:#fff;padding:12px 14px;border-radius:14px;text-align:center;display:none;z-index:10;font-size:15px}
.link{background:none;border:0;color:var(--brand);font-size:15px;width:100%;padding:12px;margin-top:6px}
</style>
</head>
<body>
<header class="top">
  <div><div class="brand">Finance</div><div class="sub" id="status">Starting…</div></div>
  <div class="grow"></div>
  <button class="icon" id="btnRefresh" aria-label="Refresh">↻</button>
  <button class="icon" id="btnSettings" aria-label="Settings">⚙</button>
</header>
<main id="view"></main>
<nav class="tabbar">
  <button class="tab on" data-tab="pending" id="tabPending"><span class="ti">●</span>Pending</button>
  <button class="tab" data-tab="month" id="tabMonth"><span class="ti">▦</span>Month</button>
</nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const BUCKETS = ['Business', 'Personal', 'Internal', 'Deposit'];
const CATS = ['Electricity', 'Plumbing', 'Repairs', 'Groceries', 'Rent', 'Staff',
  'Chai and snacks', 'Cigarettes', 'Fuel', 'Medicine', 'Food out', 'Family support',
  'Self transfer', 'Deposit refund', 'Tenant rent', 'Reimbursement', 'Other'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const sumObj = o => Object.values(o).reduce((a, b) => a + b, 0);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const monthLabel = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }); };
const shortDate = s => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); };
const cfg = () => JSON.parse(localStorage.getItem('fin_cfg') || '{}');

let items = [];
let state = { tab: 'pending', filter: 'all', query: '', month: ymd(new Date()) };
let ctx = null;

// ---------- Network (JSONP: Apps Script responses can't be read by a normal fetch) ----------
function jsonp(params) {
  return new Promise((resolve, reject) => {
    const name = 'cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const done = () => { delete window[name]; s.remove(); clearTimeout(timer); };
    const timer = setTimeout(() => { done(); reject(new Error('timed out')); }, 25000);
    window[name] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('network error')); };
    s.src = cfg().url + '?' + new URLSearchParams({ ...params, callback: name }).toString();
    document.body.appendChild(s);
  });
}

async function api(action, extra = {}) {
  const c = cfg();
  if (!c.url || !c.key) throw new Error('open Settings first');
  const r = await jsonp({ key: c.key, action, ...extra });
  if (!r.ok) throw new Error(r.error || 'failed');
  return r;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), 2200);
}
function setStatus(msg) { $('#status').textContent = msg; }
function renderLoading() { $('#view').innerHTML = '<div class="skel"></div><div class="skel"></div>'; }

// ---------- Sheet (bottom panel) ----------
function openSheet(html) { $('#sheet').innerHTML = html; $('#scrim').classList.add('on'); }
function closeSheet() { $('#scrim').classList.remove('on'); }
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });

// ---------- Pending ----------
async function loadPending() {
  const cached = JSON.parse(localStorage.getItem('fin_cache') || 'null');
  if (!items.length) {
    if (cached) { items = cached.items; renderPending(); setStatus('Saved list · updating…'); }
    else renderLoading();
  }
  try {
    const r = await api('pending');
    items = r.items;
    localStorage.setItem('fin_cache', JSON.stringify({ at: Date.now(), items }));
    setStatus('Updated ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }));
    renderPending();
  } catch (e) {
    if (items.length) setStatus('Offline · showing saved list');
    else {
      $('#view').innerHTML = `<div class="empty"><b>Couldn't reach the server</b>${esc(e.message)}<br><br>
        <button class="btn primary" data-act="settings">Open settings</button></div>`;
      setStatus('Not connected');
    }
  }
}

function renderPending() {
  const review = items.filter(i => i.status === 'NEEDS REVIEW').length;
  const sugg = items.length - review;
  $('#view').innerHTML = `
    <div class="seg">
      <button data-filter="all" class="${state.filter === 'all' ? 'on' : ''}">All ${items.length}</button>
      <button data-filter="review" class="${state.filter === 'review' ? 'on' : ''}">Review ${review}</button>
      <button data-filter="sugg" class="${state.filter === 'sugg' ? 'on' : ''}">Suggested ${sugg}</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search name, note or amount" value="${esc(state.query)}">
    <div id="list"></div>`;
  $('#q').addEventListener('input', e => { state.query = e.target.value; renderList(); });
  renderList();
}

function renderList() {
  if (!items.length) { $('#list').innerHTML = '<div class="empty"><b>All clear</b>Nothing needs your attention.</div>'; return; }
  const q = state.query.trim().toLowerCase();
  const list = items.filter(i => {
    if (state.filter === 'review' && i.status !== 'NEEDS REVIEW') return false;
    if (state.filter === 'sugg' && i.status !== 'PENDING') return false;
    if (!q) return true;
    return `${i.counterparty} ${i.notes} ${i.amount}`.toLowerCase().includes(q);
  });
  if (!list.length) { $('#list').innerHTML = '<div class="empty">Nothing matches this filter.</div>'; return; }
  $('#list').innerHTML = list.map(card).join('');
}

function card(i) {
  const hasSug = !!i.sBucket;
  const canAccept = hasSug && i.confidence !== 'unsure';
  const credit = i.direction === 'CREDIT';
  const pill = i.status === 'PENDING'
    ? '<span class="pill amber">Suggested</span>'
    : '<span class="pill red">Needs review</span>';
  const sug = hasSug
    ? `<span class="sug"><i class="dot ${esc(i.confidence)}"></i>${esc(i.sBucket)} · ${esc(i.sCategory)}${i.sProperty ? ' · ' + esc(i.sProperty) : ''}</span>`
    : '<span class="meta">No suggestion yet</span>';
  return `<article class="card">
    <div class="row between">
      <div class="who">
        <div class="name">${esc(i.counterparty || 'Unnamed')}</div>
        <div class="meta">${shortDate(i.date)} · ${esc(i.account)}${i.notes ? ' · ' + esc(i.notes) : ''}</div>
      </div>
      <div class="amt ${credit ? 'in' : ''}">${credit ? '+' : '−'}${inr(i.amount)}</div>
    </div>
    <div class="row between mt">${pill}${sug}</div>
    <div class="actions">
      <button class="btn primary" data-act="accept" data-ref="${esc(i.ref)}" ${canAccept ? '' : 'disabled'}>Accept</button>
      <button class="btn ghost" data-act="edit" data-ref="${esc(i.ref)}">Edit</button>
    </div>
  </article>`;
}

async function saveItem(item, p) {
  const idx = items.indexOf(item);
  items.splice(idx, 1);
  renderPending();
  try {
    await api('save', { ref: item.ref, ...p });
    toast('Saved · ' + p.category);
  } catch (err) {
    items.splice(idx, 0, item);
    renderPending();
    toast('Not saved: ' + err.message);
  }
}

function openEdit(ref) {
  const item = items.find(x => x.ref === ref);
  if (!item) return;
  ctx = {
    item,
    bucket: item.bucket || item.sBucket || 'Personal',
    category: item.category || item.sCategory || 'Other',
    property: item.property || item.sProperty || '',
    notes: item.notes || ''
  };
  openSheet(`
    <div class="grip"></div>
    <h3>${esc(item.counterparty || 'Transaction')}</h3>
    <div class="meta">${inr(item.amount)} · ${shortDate(item.date)} · ${item.direction === 'CREDIT' ? 'received' : 'paid'}</div>
    <div class="label">Bucket</div>
    <div class="seg" id="bk">${BUCKETS.map(b => `<button data-bucket="${b}" class="${b === ctx.bucket ? 'on' : ''}">${b}</button>`).join('')}</div>
    <div class="label">Category</div>
    <div class="chips" id="ct">${CATS.map(c => `<button class="chip ${c === ctx.category ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="label">Property (unit number)</div>
    <input id="f_prop" inputmode="numeric" value="${esc(ctx.property)}" placeholder="e.g. 170, or leave blank">
    <div class="label">Notes</div>
    <textarea id="f_notes" rows="2">${esc(ctx.notes)}</textarea>
    <div class="actions">
      <button class="btn ghost" data-act="close">Cancel</button>
      <button class="btn primary" data-act="save-edit">Save & confirm</button>
    </div>`);
}

// ---------- Month ----------
async function loadSummary() {
  renderLoading();
  try {
    const r = await api('summary', { month: state.month });
    renderSummary(r.summary);
    setStatus('Month · ' + monthLabel(state.month));
  } catch (e) {
    $('#view').innerHTML = `<div class="empty"><b>Couldn't load the month</b>${esc(e.message)}</div>`;
    setStatus('Not connected');
  }
}

function bars(obj, total, color) {
  const rows = Object.entries(obj).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '<p class="meta">Nothing this month.</p>';
  return rows.map(([k, v]) => `
    <div class="lbl2"><span>${esc(k)}</span><span>${inr(v)}</span></div>
    <div class="bar"><i style="width:${total ? Math.round(v / total * 100) : 0}%;background:${color}"></i></div>`).join('');
}

function renderSummary(s) {
  const bizOut = sumObj(s.business), perOut = sumObj(s.personal);
  const net = s.businessIncome - bizOut;
  $('#view').innerHTML = `
    <div class="row between" style="margin:4px 2px 12px">
      <button class="icon" data-month="-1" aria-label="Previous month">‹</button>
      <b>${monthLabel(s.month)}</b>
      <button class="icon" data-month="1" aria-label="Next month">›</button>
    </div>
    <div class="hero">
      <div class="meta">Business, in minus out</div>
      <div class="amt">${net < 0 ? '−' : ''}${inr(Math.abs(net))}</div>
      <div class="meta">Income ${inr(s.businessIncome)} · business spend ${inr(bizOut)}</div>
    </div>
    <div class="grid2 mt">
      <div class="stat"><div class="meta">Received</div><div class="amt in">${inr(s.received)}</div></div>
      <div class="stat"><div class="meta">Personal spend</div><div class="amt">${inr(perOut)}</div></div>
    </div>
    <div class="card mt"><b>Business spend</b>${bars(s.business, bizOut, '#2563eb')}</div>
    <div class="card"><b>Personal spend</b>${bars(s.personal, perOut, '#d97706')}</div>
    <div class="card">
      <div class="meta">Moved between your accounts (not counted)</div>
      <div class="amt">${inr(s.internal)}</div>
      <div class="meta mt">${s.pendingCount} still to review</div>
    </div>`;
}

function shiftMonth(n) {
  const [y, m] = state.month.split('-').map(Number);
  state.month = ymd(new Date(y, m - 1 + n, 1));
  loadSummary();
}

// ---------- Settings ----------
function openSettings() {
  const c = cfg();
  openSheet(`
    <div class="grip"></div>
    <h3>Settings</h3>
    <div class="meta">Stored only on this phone.</div>
    <div class="label">Web app URL</div>
    <input id="s_url" value="${esc(c.url || '')}" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="label">SMS key</div>
    <input id="s_key" type="password" value="${esc(c.key || '')}" autocapitalize="off" autocorrect="off">
    <div class="actions">
      <button class="btn ghost" data-act="test">Test connection</button>
      <button class="btn primary" data-act="save-settings">Save</button>
    </div>
    <button class="link" data-act="close">Close</button>`);
}

function writeSettings() {
  localStorage.setItem('fin_cfg', JSON.stringify({ url: $('#s_url').value.trim(), key: $('#s_key').value.trim() }));
}

// ---------- Actions (one click handler for the whole app) ----------
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-tab],[data-filter],[data-bucket],[data-cat],[data-month]');
  if (!el) return;

  if (el.dataset.tab) {
    state.tab = el.dataset.tab;
    $('#tabPending').classList.toggle('on', state.tab === 'pending');
    $('#tabMonth').classList.toggle('on', state.tab === 'month');
    state.tab === 'pending' ? loadPending() : loadSummary();
    return;
  }
  if (el.dataset.filter) { state.filter = el.dataset.filter; renderPending(); return; }
  if (el.dataset.bucket) {
    ctx.bucket = el.dataset.bucket;
    document.querySelectorAll('#bk button').forEach(b => b.classList.toggle('on', b === el));
    return;
  }
  if (el.dataset.cat) {
    ctx.category = el.dataset.cat;
    document.querySelectorAll('#ct button').forEach(b => b.classList.toggle('on', b === el));
    return;
  }
  if (el.dataset.month) { shiftMonth(Number(el.dataset.month)); return; }

  switch (el.dataset.act) {
    case 'accept': {
      const item = items.find(x => x.ref === el.dataset.ref);
      if (item && item.sBucket) {
        saveItem(item, { bucket: item.sBucket, category: item.sCategory, property: item.sProperty || '', notes: item.notes || '' });
      }
      break;
    }
    case 'edit': openEdit(el.dataset.ref); break;
    case 'save-edit': {
      const p = {
        bucket: ctx.bucket,
        category: ctx.category,
        property: $('#f_prop').value.trim(),
        notes: $('#f_notes').value.trim()
      };
      if (!CATS.includes(p.category)) { toast('Choose a category first'); return; }
      const item = ctx.item;
      closeSheet();
      saveItem(item, p);
      break;
    }
    case 'close': closeSheet(); break;
    case 'settings': openSettings(); break;
    case 'save-settings':
      writeSettings(); closeSheet(); toast('Saved'); refresh(); break;
    case 'test':
      writeSettings();
      try {
        const r = await api('pending');
        toast(`Connected · ${r.items.length} open item(s)`);
      } catch (err) {
        toast('Failed: ' + err.message);
      }
      break;
  }
});

function refresh() { state.tab === 'pending' ? loadPending() : loadSummary(); }
$('#btnRefresh').onclick = refresh;
$('#btnSettings').onclick = openSettings;

// ---------- Start ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (!cfg().url || !cfg().key) openSettings();
else loadPending();
</script>
</body>
</html>
