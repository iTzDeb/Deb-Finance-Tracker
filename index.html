<style>

main{width:min(100%,1060px);margin:0 auto;padding:24px 18px 34px}.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,440px);display:flex;background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:17px 17px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}.tab{flex:1;border:0;border-radius:11px;background:none;color:var(--muted);font-size:12px;font-weight:670;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px}.tab .ti{width:20px;height:20px;display:grid;place-items:center}.tab .ti svg{display:block;width:20px;height:20px}.tab.on{color:var(--brand);background:var(--brand-soft)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:5px 2px 20px}.page-head h1{margin:0;font-size:clamp(25px,4vw,34px);line-height:1.13;letter-spacing:-.04em}.page-description{margin:7px 0 0;color:var(--muted);font-size:14px}.review-count{display:flex;align-items:baseline;gap:7px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:var(--paper);white-space:nowrap}.review-count strong{font-size:21px;font-variant-numeric:tabular-nums}.review-count span{font-size:12px;color:var(--muted)}
.overview-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.overview-stat{min-width:0;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.overview-stat span{display:block;color:var(--muted);font-size:12px}.overview-stat strong{display:block;margin-top:3px;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.overview-stat.attention{border-color:color-mix(in srgb,var(--amber) 35%,var(--line));background:color-mix(in srgb,var(--amber) 6%,var(--paper))}
.filter-row{display:flex;align-items:center;gap:12px;margin:0 0 12px}.seg{display:flex;min-width:0;flex:1;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}.seg button{flex:1;min-width:0;border:0;background:none;padding:9px 7px;border-radius:8px;font-size:13px;font-weight:640;color:var(--muted);white-space:nowrap}.seg button.on{background:var(--brand-soft);color:var(--brand-dark)}.search{width:100%;margin:0 0 14px;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px}.search::placeholder{color:var(--muted)}
.txn-card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}.txn-top{display:flex;align-items:flex-start;gap:12px}.merchant-mark{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-size:15px;font-weight:750}.txn-main{min-width:0;flex:1}.txn-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.name{font-weight:690;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.txn-meta{margin-top:3px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.amt{font-size:18px;font-weight:730;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}.in{color:var(--green)}.txn-note{margin-top:5px;color:var(--muted);font-size:12px}.suggestion{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--bg)}.suggestion-label{font-size:11px;color:var(--muted)}.sug{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:620;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}.dot.high{background:var(--green)}.dot.medium{background:var(--amber)}.dot.unsure{background:var(--red)}.dot.rule{background:var(--brand)}.pill{font-size:10px;font-weight:740;padding:4px 8px;border-radius:999px;white-space:nowrap}.pill.amber{background:#fff2dc;color:#87500a}.pill.red{background:#fdecea;color:#a12620}@media(prefers-color-scheme:dark){.pill.amber{background:#3a2b17;color:#f2bd66}.pill.red{background:#3a2022;color:#ffaaa5}}
.actions{display:grid;grid-template-columns:1.35fr 1fr;gap:9px;margin-top:13px}.btn{border:1px solid transparent;border-radius:10px;padding:11px 12px;font-size:14px;font-weight:680;transition:background .15s ease,transform .15s ease;text-align:center;text-decoration:none}.btn.primary{background:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-dark)}.btn.ghost{background:var(--paper);border-color:var(--line);color:var(--ink)}.btn:disabled{opacity:.42}.btn:active{transform:scale(.985)}
.empty{margin:18px 0;text-align:center;padding:36px 18px;border:1px dashed var(--line);border-radius:13px;background:var(--paper);color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}.empty .btn{display:inline-block;width:auto;margin-top:14px}.label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:650}input,textarea{width:100%;padding:12px 13px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(13,25,19,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}.scrim.on{display:flex}.sheet{width:min(100%,540px);max-height:90vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:12px 22px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}.sheet h3{margin:0 0 3px;font-size:23px;letter-spacing:-.035em}.grip{width:36px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 17px}.setup-head{display:flex;gap:13px;align-items:center;margin-bottom:6px}.setup-mark{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:14px;background:var(--brand-soft);color:var(--brand);font-size:23px}.setup-copy{margin:4px 0 16px;color:var(--muted);font-size:14px;max-width:48ch}.field-hint{margin:6px 0 0;color:var(--muted);font-size:12px}.secure-note{display:flex;gap:9px;margin-top:14px;padding:11px 12px;border-radius:10px;background:var(--bg);color:var(--muted);font-size:12px}.secure-note b{color:var(--ink)}.settings-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.link{background:none;border:0;color:var(--brand);font-size:14px;width:100%;padding:12px;margin-top:5px}
@keyframes up{from{transform:translateY(22px);opacity:.7}to{transform:none;opacity:1}}.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;border-radius:6px}.lbl2{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:12px}.hero{background:var(--brand);color:#fff;border-radius:14px;padding:20px 21px}.hero .meta{color:rgba(255,255,255,.82)}.hero .amt{font-size:clamp(30px,7vw,40px);margin:5px 0 4px}.hero-label{font-size:13px;font-weight:620}.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25)}.hero-foot span{font-size:12px;color:rgba(255,255,255,.86)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}.stat .meta{font-size:12px}.stat .amt{font-size:18px;margin-top:5px}.month-controls{display:flex;align-items:center;gap:8px}.month-controls .icon{width:36px;height:36px}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}.section-title b{font-size:15px}.section-title span{font-size:12px;color:var(--muted)}.spend-panel{margin-top:11px}
.skel{height:120px;border-radius:13px;background:linear-gradient(90deg,var(--paper),var(--line),var(--paper));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}@keyframes sh{to{background-position:-200% 0}}.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:520px;margin:auto;background:#17231f;color:#fff;padding:12px 14px;border-radius:11px;text-align:center;display:none;z-index:10;font-size:14px}
.day-group{margin-bottom:19px}.day-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 3px 8px}.day-heading h2{margin:0;font-size:14px;font-weight:720;letter-spacing:-.01em}.day-heading span{font-size:11px;color:var(--muted)}.day-list{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--paper)}.txn-row{padding:14px 15px;border-bottom:1px solid var(--line)}.txn-row:last-child{border-bottom:0}.txn-icon{width:39px;height:39px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:18px;font-weight:700}.txn-amount{text-align:right;flex:none}.txn-amount .amt{font-size:16px}.txn-direction{margin-top:2px;color:var(--muted);font-size:10px}.txn-status{display:flex;align-items:center;gap:7px;min-width:0;margin:11px 0 0 51px}.txn-status .sug{font-size:11px}.txn-status .suggestion-label{flex:none;font-size:10px}.txn-row .actions{margin:10px 0 0 51px;grid-template-columns:1fr 1fr}.txn-row .btn{padding:8px 10px;font-size:12px}
@media(min-width:700px){body{padding-bottom:84px}main{padding-top:32px}.scrim{align-items:center}.sheet{border-radius:18px;padding-bottom:22px}.tabbar{bottom:14px;border-bottom:1px solid var(--line);border-radius:14px}.overview-strip{gap:12px}.txn-card{padding:18px}.txn-card:hover{border-color:color-mix(in srgb,var(--brand) 36%,var(--line))}}
@media(max-width:480px){main{padding:20px 14px 28px}.page-head{align-items:flex-start;gap:8px}.review-count{padding:8px 9px}.review-count span{max-width:60px;white-space:normal;line-height:1.2}.overview-strip{gap:7px}.overview-stat{padding:11px 10px}.overview-stat span{font-size:11px}.overview-stat strong{font-size:17px}.seg button{font-size:12px;padding:8px 4px}.filter-row{gap:8px}.search{font-size:16px}.txn-row{padding:12px 10px}.txn-icon{width:35px;height:35px}.txn-status,.txn-row .actions{margin-left:45px}.txn-row .btn{padding:8px 6px;font-size:11px}.amt{font-size:16px}.hero{padding:17px}.month-controls{gap:4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<body>
<header class="top">
  <div class="brand-lockup"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5H6a2 2 0 0 0-2 2v13h16V7a2 2 0 0 0-2-2h-2"/><rect x="8" y="3" width="8" height="4" rx="1.5"/><path d="M8 12h8M8 16h8"/></svg></span><div><div class="brand">Finance</div><div class="sub" id="status" role="status" aria-live="polite" aria-atomic="true">Starting…</div></div></div>
  <div class="grow"></div>
  <a class="icon" href="import.html" aria-label="Import statement" style="display:grid;place-items:center;text-decoration:none">⤓</a>
  <button class="icon" id="btnRefresh" aria-label="Refresh">↻</button>
  <button class="icon" id="btnSettings" aria-label="Settings">⚙</button>
</header>
<main id="view"></main>
<nav class="tabbar" aria-label="Main navigation">
  <button class="tab on" data-tab="pending" id="tabPending" aria-pressed="true" aria-controls="view"><span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5H6a2 2 0 0 0-2 2v13h16V7a2 2 0 0 0-2-2h-2"/><rect x="8" y="3" width="8" height="4" rx="1.5"/><path d="m8 13 1.5 1.5L12 12m2 1h3m-9 5 1.5 1.5L12 18m2 1h3"/></svg></span>Pending</button>
  <button class="tab" data-tab="month" id="tabMonth" aria-pressed="false" aria-controls="view"><span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01" stroke-width="2.4"/></svg></span>Month</button>
</nav>
<div class="scrim" id="scrim" aria-hidden="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
const BUCKETS = ['Business', 'Personal', 'Internal', 'Deposit'];
const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzaDUl1tqREjXTGt8liHUWtr-kE2WR_kixf3UA-98K-vt36vOZv2f4rDPSOEohBiv6_/exec';
const CATS = ['Electricity', 'Plumbing', 'Repairs', 'Groceries', 'Rent', 'Staff',
  'Chai and snacks', 'Cigarettes', 'Fuel', 'Medicine', 'Food out', 'Family support',
  'Self transfer', 'Deposit refund', 'Tenant rent', 'Reimbursement', 'Other'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const sumObj = o => Object.values(o).reduce((a, b) => a + b, 0);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const monthLabel = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }); };
const shortDate = s => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); };
function dayHeading(s) {
  const d = new Date(s + 'T00:00:00');
  if (isNaN(d)) return 'Date unavailable';
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  if (ymd(d) === ymd(new Date())) return 'Today';
  if (ymd(d) === ymd(yesterday)) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
}
function categoryIcon(item) {
  const category = String(item.sCategory || item.category || '').toLowerCase();
  if (/grocer/.test(category)) return '🛒';
  if (/fuel/.test(category)) return '⛽';
  if (/rent|property/.test(category)) return '⌂';
  if (/medicine/.test(category)) return '✚';
  if (/food|chai|snack/.test(category)) return '☕';
  if (/electric/.test(category)) return 'ϟ';
  if (/repair|plumb/.test(category)) return '⌁';
  if (/transfer|deposit/.test(category)) return '↔';
  return item.direction === 'CREDIT' ? '↓' : '↑';
}
const cfg = () => { const saved = JSON.parse(localStorage.getItem('fin_cfg') || '{}'); return { ...saved, url: saved.url || DEFAULT_WEB_APP_URL }; };

let items = [];
let state = { tab: 'pending', filter: 'all', query: '', month: ymd(new Date()) };
let ctx = null;

// ---------- Network (JSONP: Apps Script responses can't be read by a normal fetch) ----------
function jsonp(params) {
  return new Promise((resolve, reject) => {
    const name = 'cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const done = () => { delete window[name]; s.remove(); clearTimeout(timer); };
    const timer = setTimeout(() => { done(); reject(new Error('timed out')); }, 25000);
    window[name] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('network error')); };
    s.src = cfg().url + '?' + new URLSearchParams({ ...params, callback: name }).toString();
    document.body.appendChild(s);
  });
}

async function api(action, extra = {}) {
  const c = cfg();
  if (!c.url || !c.key) throw new Error('open Settings first');
  const r = await jsonp({ key: c.key, action, ...extra });
  if (!r.ok) throw new Error(r.error || 'failed');
  return r;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), 2200);
}
function setStatus(msg) { $('#status').textContent = msg; }
function renderLoading() { $('#view').innerHTML = '<div class="skel"></div><div class="skel"></div>'; }

// ---------- Sheet (bottom panel) ----------
let sheetTrigger = null;
function openSheet(html) {
  sheetTrigger = document.activeElement;
  $('#sheet').innerHTML = html;
  $('#sheet').setAttribute('role', 'dialog');
  $('#sheet').setAttribute('aria-modal', 'true');
  $('#sheet').setAttribute('aria-labelledby', 'sheetTitle');
  $('#scrim').setAttribute('aria-hidden', 'false');
  $('#scrim').classList.add('on');
  $('#sheet').querySelector('input, button')?.focus({ preventScroll: true });
}
function closeSheet() {
  $('#scrim').classList.remove('on');
  $('#scrim').setAttribute('aria-hidden', 'true');
  if (sheetTrigger instanceof HTMLElement) sheetTrigger.focus({ preventScroll: true });
}
$('#scrim').addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key !== 'Tab') return;
  const controls = [...$('#sheet').querySelectorAll('button:not(:disabled), input:not(:disabled), textarea:not(:disabled)')];
  if (!controls.length) return;
  const first = controls[0], last = controls[controls.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });

// ---------- Pending ----------
async function loadPending() {
  const cached = JSON.parse(localStorage.getItem('fin_cache') || 'null');
  if (!items.length) {
    if (cached) { items = cached.items; renderPending(); setStatus('Saved list · updating…'); }
    else renderLoading();
  }
  try {
    const r = await api('pending');
    items = r.items;
    localStorage.setItem('fin_cache', JSON.stringify({ at: Date.now(), items }));
    setStatus('Updated ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }));
    renderPending();
  } catch (e) {
    if (items.length) setStatus('Offline · showing saved list');
    else {
      $('#view').innerHTML = `<div class="empty"><b>Couldn't reach the server</b>${esc(e.message)}<br><br>
        <button class="btn primary" data-act="settings">Open settings</button></div>`;
      setStatus('Not connected');
    }
  }
}

function renderPending() {
  const review = items.filter(i => i.status === 'NEEDS REVIEW').length;
  const sugg = items.length - review;
  const openValue = items.reduce((total, item) => total + (Number(item.amount) || 0), 0);
  $('#view').innerHTML = `
    <div class="page-head">
      <div><h1>Transactions</h1><p class="page-description">Review each match before it is added to your sheet.</p></div>
      <div class="review-count"><strong>${review}</strong><span>need review</span></div>
    </div>
    <section class="overview-strip" aria-label="Pending transaction totals">
      <div class="overview-stat attention"><span>Need a decision</span><strong>${review}</strong></div>
      <div class="overview-stat"><span>Ready to confirm</span><strong>${sugg}</strong></div>
      <div class="overview-stat"><span>Open transaction value</span><strong>${inr(openValue)}</strong></div>
    </section>
    <div class="filter-row">
      <div class="seg" role="group" aria-label="Filter transactions">
        <button data-filter="all" aria-pressed="${state.filter === 'all'}" class="${state.filter === 'all' ? 'on' : ''}">All ${items.length}</button>
        <button data-filter="review" aria-pressed="${state.filter === 'review'}" class="${state.filter === 'review' ? 'on' : ''}">Review ${review}</button>
        <button data-filter="sugg" aria-pressed="${state.filter === 'sugg'}" class="${state.filter === 'sugg' ? 'on' : ''}">Suggested ${sugg}</button>
      </div>
    </div>
    <input class="search" id="q" type="search" aria-label="Search transactions" placeholder="Search payee, note or amount" value="${esc(state.query)}">
    <div id="list" aria-live="polite"></div>`;
  $('#q').addEventListener('input', e => { state.query = e.target.value; renderList(); });
  renderList();
}

function renderList() {
  if (!items.length) {
    $('#list').innerHTML = '<div class="empty"><b>You’re all caught up</b>New transactions will appear here when they need a category.<br><a class="btn primary" href="import.html">Import a statement</a></div>';
    return;
  }
  const q = state.query.trim().toLowerCase();
  const list = items.filter(i => {
    if (state.filter === 'review' && i.status !== 'NEEDS REVIEW') return false;
    if (state.filter === 'sugg' && i.status !== 'PENDING') return false;
    if (!q) return true;
    return `${i.counterparty} ${i.notes} ${i.amount}`.toLowerCase().includes(q);
  });
  if (!list.length) {
    $('#list').innerHTML = '<div class="empty"><b>No matching transactions</b>Try another search or choose a different filter.</div>';
    return;
  }
  const groups = groupByDate(list);
  $('#list').innerHTML = groups.map(([date, dayItems]) => `
    <section class="day-group" aria-label="${esc(dayHeading(date))}">
      <div class="day-heading"><h2>${esc(dayHeading(date))}</h2><span>${dayItems.length} ${dayItems.length === 1 ? 'transaction' : 'transactions'}</span></div>
      <div class="day-list">${dayItems.map(card).join('')}</div>
    </section>`).join('');
}

function groupByDate(entries) {
  const sorted = [...entries].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.time || '').localeCompare(String(a.time || '')));
  const groups = new Map();
  sorted.forEach(item => {
    const date = String(item.date || '');
    if (!groups.has(date)) groups.set(date, []);
    groups.get(date).push(item);
  });
  return [...groups];
}

function card(i) {
  const hasSug = !!i.sBucket;
  const canAccept = hasSug && i.confidence !== 'unsure';
  const credit = i.direction === 'CREDIT';
  const name = i.counterparty || 'Unnamed transaction';
  const pill = i.status === 'PENDING'
    ? '<span class="pill amber">Suggested</span>'
    : '<span class="pill red">Needs review</span>';
  const sug = hasSug
    ? `<span class="sug"><i class="dot ${esc(i.confidence)}"></i>${esc(i.sBucket)} · ${esc(i.sCategory)}${i.sProperty ? ' · ' + esc(i.sProperty) : ''}</span>`
    : '<span class="sug">Choose a category in Edit</span>';
  return `<article class="txn-row">
    <div class="txn-top">
      <div class="txn-icon" aria-hidden="true">${categoryIcon(i)}</div>
      <div class="txn-main">
        <div class="txn-title-row">
          <div class="txn-main"><div class="name">${esc(name)}</div><div class="txn-meta">${esc(i.account || 'Account')}${i.notes ? ' · ' + esc(i.notes) : ''}</div></div>
          <div class="txn-amount"><div class="amt ${credit ? 'in' : ''}">${credit ? '+' : '−'}${inr(i.amount)}</div><div class="txn-direction ${credit ? 'in' : ''}">${credit ? 'Received' : 'Paid'}</div></div>
        </div>
      </div>
    </div>
    <div class="txn-status">${pill}<span class="suggestion-label">${hasSug ? 'Suggested' : 'Category'}:</span>${sug}</div>
    <div class="actions">
      <button class="btn primary" data-act="accept" data-ref="${esc(i.ref)}" ${canAccept ? '' : 'disabled'}>${canAccept ? 'Confirm & save' : 'Edit to categorize'}</button>
      <button class="btn ghost" data-act="edit" data-ref="${esc(i.ref)}">Edit details</button>
    </div>
  </article>`;
}

async function saveItem(item, p) {
  const idx = items.indexOf(item);
  items.splice(idx, 1);
  renderPending();
  try {
    await api('save', { ref: item.ref, ...p });
    toast('Saved · ' + p.category);
  } catch (err) {
    items.splice(idx, 0, item);
    renderPending();
    toast('Not saved: ' + err.message);
  }
}

function openEdit(ref) {
  const item = items.find(x => x.ref === ref);
  if (!item) return;
  ctx = {
    item,
    bucket: item.bucket || item.sBucket || 'Personal',
    category: item.category || item.sCategory || 'Other',
    property: item.property || item.sProperty || '',
    notes: item.notes || ''
  };
  openSheet(`
    <div class="grip"></div>
    <h3 id="sheetTitle">${esc(item.counterparty || 'Transaction')}</h3>
    <div class="meta">${inr(item.amount)} · ${shortDate(item.date)} · ${item.direction === 'CREDIT' ? 'received' : 'paid'}</div>
    <div class="label">Bucket</div>
    <div class="seg" id="bk">${BUCKETS.map(b => `<button data-bucket="${b}" class="${b === ctx.bucket ? 'on' : ''}">${b}</button>`).join('')}</div>
    <div class="label">Category</div>
    <div class="chips" id="ct">${CATS.map(c => `<button class="chip ${c === ctx.category ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="label">Property (unit number)</div>
    <input id="f_prop" inputmode="numeric" value="${esc(ctx.property)}" placeholder="e.g. 170, or leave blank">
    <div class="label">Notes</div>
    <textarea id="f_notes" rows="2">${esc(ctx.notes)}</textarea>
    <div class="actions">
      <button class="btn ghost" data-act="close">Cancel</button>
      <button class="btn primary" data-act="save-edit">Save & confirm</button>
    </div>`);
}

// ---------- Month ----------
async function loadSummary() {
  renderLoading();
  try {
    const r = await api('summary', { month: state.month });
    renderSummary(r.summary);
    setStatus('Month · ' + monthLabel(state.month));
  } catch (e) {
    $('#view').innerHTML = `<div class="empty"><b>Couldn't load the month</b>${esc(e.message)}</div>`;
    setStatus('Not connected');
  }
}

function bars(obj, total, color) {
  const rows = Object.entries(obj).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '<p class="meta">Nothing this month.</p>';
  return rows.map(([k, v]) => `
    <div class="lbl2"><span>${esc(k)}</span><span>${inr(v)}</span></div>
    <div class="bar"><i style="width:${total ? Math.round(v / total * 100) : 0}%;background:${color}"></i></div>`).join('');
}

function renderSummary(s) {
  const bizOut = sumObj(s.business), perOut = sumObj(s.personal);
  const net = s.businessIncome - bizOut;
  $('#view').innerHTML = `
    <div class="page-head month-head">
      <div><h1>${monthLabel(s.month)}</h1><p class="page-description">A clear view of where your money went.</p></div>
      <div class="month-controls">
        <button class="icon" data-month="-1" aria-label="Previous month">‹</button>
        <button class="icon" data-month="1" aria-label="Next month">›</button>
      </div>
    </div>
    <section class="hero" aria-label="Business monthly result">
      <div class="hero-label">Business result</div>
      <div class="amt">${net < 0 ? '−' : ''}${inr(Math.abs(net))}</div>
      <div class="meta">Income minus business spending</div>
      <div class="hero-foot"><span>Income ${inr(s.businessIncome)}</span><span>Business spend ${inr(bizOut)}</span></div>
    </section>
    <div class="grid2 mt" aria-label="Other monthly totals">
      <div class="stat"><div class="meta">Money received</div><div class="amt in">${inr(s.received)}</div></div>
      <div class="stat"><div class="meta">Personal spending</div><div class="amt">${inr(perOut)}</div></div>
    </div>
    <section class="card spend-panel"><div class="section-title"><b>Business spending</b><span>${inr(bizOut)} total</span></div>${bars(s.business, bizOut, 'var(--brand)')}</section>
    <section class="card spend-panel"><div class="section-title"><b>Personal spending</b><span>${inr(perOut)} total</span></div>${bars(s.personal, perOut, 'var(--amber)')}</section>
    <div class="grid2 mt">
      <div class="stat"><div class="meta">Transfers between accounts</div><div class="amt">${inr(s.internal)}</div></div>
      <div class="stat"><div class="meta">Waiting for review</div><div class="amt">${s.pendingCount}</div></div>
    </div>`;
}

function shiftMonth(n) {
  const [y, m] = state.month.split('-').map(Number);
  state.month = ymd(new Date(y, m - 1 + n, 1));
  loadSummary();
}

// ---------- Settings ----------
function openSettings() {
  const c = cfg();
  openSheet(`
    <div class="grip"></div>
    <div class="setup-head"><div class="setup-mark" aria-hidden="true">↗</div><div><h3 id="sheetTitle">Connect your sheet</h3><div class="meta">A quick one-time setup</div></div></div>
    <p class="setup-copy">Enter the key for your Apps Script so pending transactions and monthly totals can sync with Google Sheets.</p>
    <label class="label" for="s_url">Apps Script web app URL</label>
    <input id="s_url" type="url" value="${esc(c.url || '')}" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="label" for="s_key">SMS key</label>
    <input id="s_key" type="password" value="${esc(c.key || '')}" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="Enter your key">
    <div class="secure-note"><span aria-hidden="true">🔒</span><span><b>Your key stays on this device.</b> It is saved in this browser, not in the app’s source code.</span></div>
    <div class="settings-actions">
      <button class="btn ghost" data-act="test">Check connection</button>
      <button class="btn primary" data-act="save-settings">Save settings</button>
    </div>
    ${c.key ? '<button class="link" data-act="close">Cancel</button>' : ''}`);
}

function writeSettings() {
  localStorage.setItem('fin_cfg', JSON.stringify({ url: $('#s_url').value.trim(), key: $('#s_key').value.trim() }));
}

// ---------- Actions (one click handler for the whole app) ----------
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-tab],[data-filter],[data-bucket],[data-cat],[data-month]');
  if (!el) return;

  if (el.dataset.tab) {
    state.tab = el.dataset.tab;
    $('#tabPending').classList.toggle('on', state.tab === 'pending');
    $('#tabPending').setAttribute('aria-pressed', String(state.tab === 'pending'));
    $('#tabMonth').classList.toggle('on', state.tab === 'month');
    $('#tabMonth').setAttribute('aria-pressed', String(state.tab === 'month'));
    state.tab === 'pending' ? loadPending() : loadSummary();
    return;
  }
  if (el.dataset.filter) { state.filter = el.dataset.filter; renderPending(); return; }
  if (el.dataset.bucket) {
    ctx.bucket = el.dataset.bucket;
    document.querySelectorAll('#bk button').forEach(b => b.classList.toggle('on', b === el));
    return;
  }
  if (el.dataset.cat) {
    ctx.category = el.dataset.cat;
    document.querySelectorAll('#ct button').forEach(b => b.classList.toggle('on', b === el));
    return;
  }
  if (el.dataset.month) { shiftMonth(Number(el.dataset.month)); return; }

  switch (el.dataset.act) {
    case 'accept': {
      const item = items.find(x => x.ref === el.dataset.ref);
      if (item && item.sBucket) {
        saveItem(item, { bucket: item.sBucket, category: item.sCategory, property: item.sProperty || '', notes: item.notes || '' });
      }
      break;
    }
    case 'edit': openEdit(el.dataset.ref); break;
    case 'save-edit': {
      const p = {
        bucket: ctx.bucket,
        category: ctx.category,
        property: $('#f_prop').value.trim(),
        notes: $('#f_notes').value.trim()
      };
      if (!CATS.includes(p.category)) { toast('Choose a category first'); return; }
      const item = ctx.item;
      closeSheet();
      saveItem(item, p);
      break;
    }
    case 'close': closeSheet(); break;
    case 'settings': openSettings(); break;
    case 'save-settings':
      writeSettings(); closeSheet(); toast('Saved'); refresh(); break;
    case 'test':
      writeSettings();
      try {
        const r = await api('pending');
        toast(`Connected · ${r.items.length} open item(s)`);
      } catch (err) {
        toast('Failed: ' + err.message);
      }
      break;
  }
});

function refresh() { state.tab === 'pending' ? loadPending() : loadSummary(); }
$('#btnRefresh').onclick = refresh;
$('#btnSettings').onclick = openSettings;

// ---------- Start ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (!cfg().key) { setStatus('Setup required'); openSettings(); }
else loadPending();
</script>
</body>
</html>
