<style>
/* Ledger paper system — shared with index.html / mom.html (see DESIGN.md) */

<body>
<header class="top"><a href="index.html">‹ Back</a><h1>Import statement</h1></header>
<main>
  <div class="card">
    <label for="acct">Which account is this statement from?</label>
    <select id="acct">
      <option>Kotak</option><option>BOI</option><option>Mother SBI current</option>
      <option>Paytm</option><option>Google Pay</option><option>Other</option>
    </select>
    <label for="file">Statement file (CSV, Excel or PDF)</label>
    <input id="file" type="file" accept=".csv,.txt,.xlsx,.xls,.pdf">
    <label for="pass">Password (only for protected files)</label>
    <input id="pass" type="password" autocomplete="off" placeholder="Statement password">
    <div class="meta" style="margin-top:6px">Google Pay statements: the account is read from each row (“Paid by …”); UPI Circle → Mother SBI current.</div>
    <div class="meta" style="margin-top:10px">Entries already in your sheet are skipped. New ones are placed in date and time order.</div>
    <div id="status" class="meta" style="margin-top:12px" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>
  <div id="preview"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => { const value = Number(n) || 0; const digits = Number.isInteger(value) ? 0 : 2; return '₹' + value.toLocaleString('en-IN', { minimumFractionDigits: digits, maximumFractionDigits: 2 }); };
const pad = n => String(n).padStart(2, '0');
const DEFAULT_WEB_APP_URL = 'https://deb-finance.vercel.app/api/exec';
const cfg = () => { const saved = JSON.parse(localStorage.getItem('fin_cfg') || '{}'); return { ...saved, url: saved.url || DEFAULT_WEB_APP_URL }; };
const setStatus = html => { $('#status').innerHTML = html; };
let txns = [];

// ---------- Network (the Vercel backend sends CORS headers, so a normal fetch works) ----------
async function api(action, extra = {}, ms = 25000) {
  const c = cfg();
  if (!c.url || !c.key) throw new Error('Open the Finance app and save the settings first');
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  let r;
  try {
    const res = await fetch(c.url + '?' + new URLSearchParams({ key: c.key, action, ...extra }), { signal: controller.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    r = await res.json();
  } finally {
    clearTimeout(timer);
  }
  if (!r.ok) throw new Error(r.error || 'failed');
  return r;
}

// ---------- Parsing helpers ----------
const MON = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };

function parseDate(v) {
  const s = String(v ?? '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[\/.\- ]+(\d{1,2}|[A-Za-z]{3})[\/.\- ,]+(\d{4}|\d{2})/);
  if (!m) return '';                                   // day first, as used in India
  const mo = /\d/.test(m[2]) ? Number(m[2]) : MON[m[2].toLowerCase()];
  if (!mo || mo > 12) return '';
  const y = m[3].length === 2 ? '20' + m[3] : m[3];
  return `${y}-${pad(mo)}-${pad(m[1])}`;
}

function parseTime(v) {
  const m = String(v ?? '').match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?/);
  if (!m) return '';
  let h = Number(m[1]);
  if (m[3]) {
    const pm = /p/i.test(m[3]);
    if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12;
  }
  return pad(h) + ':' + m[2];
}

function parseAmt(v) {
  const n = Number(String(v ?? '').replace(/[₹,\s]/g, '').replace(/(Dr|Cr)$/i, ''));
  return isFinite(n) ? Math.abs(n) : NaN;
}

// Pulls the ref and payee out of a bank narration, e.g.
//   BOI      UPI/627498773714/DR/THANDI/YESB/...
//   other    UPI/DR/627498773714/THANDI/YESB/...
//   NEFT     NEFT/SBIN226275322203/SBIN/ITDTAX REFUND
function narrationParts(v) {
  const s = String(v ?? '').replace(/\s+/g, ' ').trim();
  // SBI statements prefix transfers with "DEP TFR" (credit) / "WDL TFR" (debit).
  const sbi = s.replace(/^(?:DEP|WDL)\s*TFR\s+/i, '').trim();
  const text = sbi !== s ? sbi : s;
  // SBI internal transfer: SBIY.../M/Transfer ... OF Mrs. NAME AT ...
  let m = text.match(/^(SBIY\d{9,})\b/i);
  if (m) {
    const who = text.match(/\bOF\s+(?:(?:MR|MRS|MS|MISS|SHRI|SMT)\.?\s+)?([A-Z][A-Z .]*?)(?=\s+AT\b|$)/i);
    return { ref: m[1].toUpperCase(), party: who ? who[1].replace(/\s+/g, ' ').trim() : 'SBI Transfer' };
  }
  // SBI IMPS: IMPS/<ref>/<BANK>-<xxNNN>-<NAME>/<purpose> ...
  m = text.match(/^IMPS\/(\d{9,})\/([A-Za-z0-9]+)-[xX]{2}\d+-([^\/]+)/i);
  if (m) return { ref: m[1], party: m[3].trim() };
  // SBI UPI credit with no payer name in the narration.
  m = text.match(/^UPI\/REF\/(\d{9,})\/(?:CR|DR)\b/i);
  if (m) return { ref: m[1], party: 'UPI' };
  // SBI bill payments / cash deposits / ATM / charges / interest.
  m = text.match(/^Bill Payment-?(SB[A-Z0-9]+)/i);
  if (m) return { ref: m[1], party: 'Bill Payment' };
  if (/^Bill Payment\b/i.test(text)) return { ref: '', party: 'Bill Payment' };
  if (/^CSH DEP\b/i.test(text)) return { ref: '', party: 'Cash Deposit' };
  if (/^ATM\b/i.test(text)) return { ref: '', party: 'ATM Cash' };
  if (/^(?:SMSChrgs|CHRG|SERVICE CHARGE)/i.test(text)) return { ref: '', party: 'Bank Charges' };
  if (/^(?:INT\.?PD|INTEREST|SBINT\.?PD)/i.test(text)) return { ref: '', party: 'Interest' };
  m = text.match(/^UPI\/(\d{9,})\/(?:DR|CR)\/([^\/]+)/i);
  if (m) return { ref: m[1], party: m[2].trim() };
  m = text.match(/^UPI\/(?:DR|CR)\/(\d{9,})\/([^\/]+)/i);
  if (m) return { ref: m[1], party: m[2].trim() };
  // Kotak: UPI/NAME/BANK/ref/...
  m = text.match(/^UPI\/([^\/]+)\/[A-Za-z]{4}\/(\d{9,})/);
  if (m) return { ref: m[2], party: m[1].trim() };
  // Kotak IMPS: SentIMPS<ref><name>/BANK/...
  m = text.match(/^SentIMPS(\d{9,})([^\/]+)\//i);
  if (m) return { ref: m[1], party: m[2].trim() };
  // Card payments: PCI/0165/MERCHANT/... and PCD/0165/MERCHANT/...
  m = text.match(/^(?:PCI|PCD)\/\d+\/([^\/]+)/i);
  if (m) return { ref: '', party: m[1].trim() };
  m = text.match(/^VISA-REFUND\/(?:[^\/]+\/){2}(.+)$/i);
  if (m) return { ref: '', party: m[1].trim() };
  m = text.match(/^(?:NEFT|IMPS|RTGS)\/([A-Z0-9]{8,})\/(?:[A-Z]{4}\/)?(.+)$/i);
  if (m) return { ref: m[1], party: m[2].trim() };
  // Paytm human narrations: "Paid to X", "Received from X", "Automatic payment for X".
  if (/\bpaytm\s+wallet\b/i.test(text)) return { ref: '', party: 'Paytm Wallet' };
  m = text.match(/^Transferred to Self,?\s*(.*)$/i);
  if (m) return { ref: '', party: m[1] ? 'Self Transfer · ' + m[1].trim() : 'Self Transfer' };
  m = text.match(/^(?:Paid to|Paid for|Money sent to|Sent to|Payment to|Pay to|Payment for)\s+(.+)$/i);
  if (m) return { ref: '', party: m[1].trim() };
  m = text.match(/^(?:Money received from|Received from|Received by|Paid by|Added from)\s+(.+)$/i);
  if (m) return { ref: '', party: m[1].trim() };
  m = text.match(/^Automatic payment for\s+(.+)$/i) || text.match(/^Automatic payment of .*? for\s+(.+)$/i);
  if (m) return { ref: '', party: m[1].trim() };
  m = text.match(/^(\d{9,})$/);                                  // narration is only a ref
  if (m) return { ref: m[1], party: text };
  return { ref: '', party: text };
}
function cleanParty(v) {
  return narrationParts(v).party;
}

function mk(day, time, direction, amount, desc, ref, account, source) {
  return {
    stamp: day + ' ' + (time || '00:00'), direction, amount,
    party: cleanParty(desc), ref: String(ref || '').trim(),
    account, source: source || ('Import-' + account)
  };
}

// ---------- Reading files ----------
// A header row has a date column and an amount/debit/credit column.
function findHeaderRow(rows) {
  return rows.findIndex(r => r.some(c => /date/i.test(String(c))) &&
    r.some(c => /amount|debit|credit|withdraw|deposit/i.test(String(c))));
}

// Multi-tab workbooks (e.g. Paytm: Summary + Passbook) — prefer the sheet
// whose name looks like transactions and has a header, else any with a header,
// else the largest.
function pickSheet(sheets) {
  if (!sheets.length) return null;
  const named = sheets.find(s => /passbook|payment history|transaction|statement/i.test(s.name || '') && findHeaderRow(s.rows) >= 0);
  if (named) return named;
  const withHeader = sheets.find(s => findHeaderRow(s.rows) >= 0);
  if (withHeader) return withHeader;
  return sheets.reduce((a, b) => (b.rows.length > a.rows.length ? b : a));
}

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

async function pdfLines(file) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  let pdf;
  try {
    pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer(), password: $('#pass').value || undefined }).promise;
  } catch (err) {
    if (err && (err.name === 'PasswordException' || /password/i.test(String(err.message)))) throw new Error('This PDF is password-protected. Enter the statement password above.');
    throw err;
  }
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await (await pdf.getPage(p)).getTextContent();
    const rows = new Map();
    page.items.forEach(it => {
      const y = Math.round(it.transform[5] / 3);       // items on the same line share a y position
      if (!rows.has(y)) rows.set(y, []);
      rows.get(y).push(it);
    });
    [...rows.keys()].sort((a, b) => b - a).forEach(y => {
      const line = rows.get(y).sort((a, b) => a.transform[4] - b.transform[4])
        .map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
      if (line) lines.push([line]);
    });
  }
  return lines;
}

async function base64Of(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(bin);
}
async function decryptFile(buf, password) {
  const c = cfg();
  if (!c.key) throw new Error('Open the Finance app and save its settings first');
  const res = await fetch('api/decrypt', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ key: c.key, file: await base64Of(buf), password })
  });
  let r = null;
  try { r = await res.json(); } catch (err) { /* not JSON */ }
  if (!res.ok || !r || !r.ok) throw new Error((r && r.error) || 'Could not open the protected file.');
  const bin = atob(r.file);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function readRows(file) {
  const n = file.name.toLowerCase();
  if (/\.(csv|txt)$/.test(n)) return parseCSV(await file.text());
  if (/\.(xlsx|xls)$/.test(n)) {
    const buf = await file.arrayBuffer();
    let wb;
    try { wb = XLSX.read(buf, { type: 'array' }); }
    catch (err) {
      if (!/password/i.test(String(err.message || ''))) throw err;
      const pass = $('#pass').value;
      if (!pass) throw new Error('This file is password-protected. Enter the statement password above.');
      wb = XLSX.read(await decryptFile(buf, pass), { type: 'array' });
    }
    const sheets = wb.SheetNames.map(name => ({
      name,
      rows: XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' })
    }));
    return (pickSheet(sheets) || sheets[0]).rows;
  }
  if (/\.pdf$/.test(n)) return pdfLines(file);
  throw new Error('Use a CSV, Excel or PDF file');
}

// Table with a header row (CSV, Excel, Paytm exports)
function fromTable(rows, account) {
  const hi = findHeaderRow(rows);
  if (hi < 0) return fromLines(rows, account);
  const h = rows[hi].map(c => String(c).toLowerCase());
  const find = re => h.findIndex(c => re.test(c));
  const iDate = find(/date/), iTime = find(/time/);
  const iDesc = find(/description|narration|particular|details|remark|payee|counterparty|name/);
  const iRef = find(/ref|utr|rrn|txn\s*id|transaction\s*id/);
  const iDr = find(/debit|withdraw|paid out/), iCr = find(/credit|deposit|received/);
  const iAmt = find(/^amount/), iType = find(/type|dr\s*\/\s*cr|cr\s*\/\s*dr/);
  const out = [];
  rows.slice(hi + 1).forEach(r => {
    const day = parseDate(r[iDate]);
    if (!day) return;
    const desc = iDesc >= 0 ? r[iDesc] : r.join(' ');
    let direction = '', amount = NaN;
    if (iDr >= 0 && parseAmt(r[iDr])) { direction = 'DEBIT'; amount = parseAmt(r[iDr]); }
    else if (iCr >= 0 && parseAmt(r[iCr])) { direction = 'CREDIT'; amount = parseAmt(r[iCr]); }
    else if (iAmt >= 0 && parseAmt(r[iAmt])) {
      amount = parseAmt(r[iAmt]);
      const raw = String(r[iAmt] || '');
      // Paytm signs the amount; otherwise infer from the type column or narration.
      if (/^\s*-/.test(raw)) direction = 'DEBIT';
      else if (/^\s*\+/.test(raw)) direction = 'CREDIT';
      else {
        const typeVal = iType >= 0 ? String(r[iType] || '') : '';
        if (/\bcr\b|credit|received|deposit/i.test(typeVal)) direction = 'CREDIT';
        else if (/\bdr\b|debit|withdraw|sent|paid\s*out/i.test(typeVal)) direction = 'DEBIT';
        else {
          const t = raw + ' ' + typeVal + ' ' + desc;
          direction = /\bdr\b|debit|sent|paid|payment/i.test(t) ? 'DEBIT'
            : /\bcr\b|credit|received|added|refund|cashback|transferred to self/i.test(t) ? 'CREDIT' : 'DEBIT';
        }
      }
    }
    if (!direction || !(amount > 0)) return;
    const time = parseTime(iTime >= 0 ? r[iTime] : r.join(' '));
    // Prefer the UPI ref inside the narration: SMS alerts use that same ref,
    // while banks' own ref columns differ (Kotak: "UPI-210039702734").
    const ref = narrationParts(desc).ref || (iRef >= 0 ? String(r[iRef]).trim() : '');
    out.push(mk(day, time, direction, amount, desc, ref, account));
  });
  return out;
}

// Free text lines (PDF). Best effort: check the preview before importing.
function fromLines(rows, account) {
  const out = [];
  rows.forEach(r => {
    const text = (Array.isArray(r) ? r.join(' ') : String(r)).replace(/\s+/g, ' ').trim();
    const dm = text.match(/\d{1,2}[\/.\- ]+(?:\d{1,2}|[A-Za-z]{3})[\/.\- ,]+\d{2,4}/);
    const am = text.match(/\d{1,3}(?:,\d{2,3})*\.\d{2}/);
    if (!dm || !am) return;
    const day = parseDate(dm[0]);
    const amount = parseAmt(am[0]);
    if (!day || !(amount > 0)) return;
    const direction = /\bcr\b|credit|received|deposit/i.test(text) ? 'CREDIT' : 'DEBIT';
    const desc = text.slice(dm.index + dm[0].length, am.index);
    const ref = narrationParts(text).ref;
    out.push(mk(day, parseTime(text), direction, amount, desc, ref, account));
  });
  return out;
}

// Google Pay (UPI Circle) statements: each transaction lists "Paid by X", where
// X is "UPI Circle" (the linked SBI current account), "Kotak … 7991", or "Bank Of India".
function accountForGpay(paidBy) {
  const s = String(paidBy || '').trim();
  if (/upi circle/i.test(s)) return 'Mother SBI current';
  if (/kotak/i.test(s)) return 'Kotak';
  if (/bank of india|BOI/i.test(s)) return 'BOI';
  return 'Other';
}

// pdf.js groups each transaction into three lines:
//   "24 Aug, 2026 Paid to NAME ₹amount"
//   "04:09 PM UPI Transaction ID: <ref>"
//   "Paid by <account>"
function fromGpayLines(lines) {
  const out = [];
  let cur = null;
  const push = () => { if (cur && cur.day && cur.amount > 0) out.push(mk(cur.day, cur.time, cur.direction, cur.amount, cur.party, cur.ref, cur.account || 'Other', 'Import-GPay')); };
  for (const raw of lines) {
    const line = (Array.isArray(raw) ? raw.join(' ') : String(raw)).replace(/\s+/g, ' ').trim();
    if (!line) continue;
    let m = line.match(/^(\d{1,2} \w{3}, \d{4})\s+(Paid to|Received from)\s+(.+?)\s*₹\s*([\d,]+(?:\.\d{2})?)\s*$/i);
    if (m) {
      push();
      cur = { day: parseDate(m[1]), time: '', direction: /received/i.test(m[2]) ? 'CREDIT' : 'DEBIT', party: m[3].trim(), amount: parseAmt(m[4]), ref: '', account: '' };
      continue;
    }
    if (cur) {
      m = line.match(/^(\d{1,2}:\d{2})\s*(AM|PM)\s*UPI Transaction ID:\s*(\d+)/i);
      if (m) { cur.time = parseTime(line); cur.ref = m[3]; continue; }
      m = line.match(/Paid by\s+(.+)$/i);
      if (m) { cur.account = accountForGpay(m[1]); continue; }
    }
  }
  push();
  return out;
}

// ---------- Flow ----------
async function parseFile(f) {
  if (!f) return;
  $('#preview').innerHTML = '';
  setStatus(`<span class="busy">Reading ${esc(f.name)}…</span>`);
  try {
    const rows = await readRows(f);
    const gpay = rows.some(r => /UPI Transaction ID/i.test(Array.isArray(r) ? r.join(' ') : String(r)));
    txns = gpay ? fromGpayLines(rows) : fromTable(rows, $('#acct').value);
    if (!txns.length) throw new Error('No transactions found. The layout may differ; send a sample.');
    setStatus('');
    renderPreview(f.name);
  } catch (err) {
    txns = [];
    setStatus(`<span class="err">${esc(err.message)}</span>`);
  }
}
$('#file').addEventListener('change', e => { const f = e.target.files[0]; if (f) parseFile(f); });
$('#pass').addEventListener('change', () => { const f = $('#file').files[0]; if (f) parseFile(f); });

function renderPreview(name) {
  const dates = txns.map(t => t.stamp.slice(0, 10)).sort();
  const paid = txns.filter(t => t.direction === 'DEBIT').reduce((s, t) => s + t.amount, 0);
  const got = txns.filter(t => t.direction === 'CREDIT').reduce((s, t) => s + t.amount, 0);
  const rows = txns.slice(0, 8).map(t => `<tr><td>${t.stamp.slice(0, 10)}</td><td>${esc(t.party)}</td>
    <td class="r">${t.direction === 'CREDIT' ? '<span class="in">+' : '−'}${inr(t.amount)}${t.direction === 'CREDIT' ? '</span>' : ''}</td></tr>`).join('');
  $('#preview').innerHTML = `
    <div class="card">
      <div class="meta">${esc(name)}</div>
      <div class="big">${txns.length} entries</div>
      <div class="meta">${dates[0]} to ${dates[dates.length - 1]}</div>
      <div class="meta" style="margin-top:8px">Paid ${inr(paid)} · Received ${inr(got)}</div>
      <table><tr><th>Date</th><th>Payee</th><th class="r">Amount</th></tr>${rows}</table>
      ${txns.length > 8 ? `<div class="meta" style="margin-top:6px">…and ${txns.length - 8} more</div>` : ''}
      <button class="btn" id="go">Import ${txns.length} entries</button>
    </div>`;
  $('#go').onclick = runImport;
}

async function runImport() {
  const batch = 'B' + Date.now();
  const CH = 12;                                       // rows per request, keeps URLs short
  $('#go').disabled = true;
  try {
    for (let i = 0; i < txns.length; i += CH) {
      setStatus(`<span class="busy">Sending ${Math.min(i + CH, txns.length)} of ${txns.length}…</span>`);
      await api('importChunk', { batch, rows: JSON.stringify(txns.slice(i, i + CH)) });
    }
    setStatus('<span class="busy">Cross-checking against your sheet…</span>');
    const r = await api('importCommit', { batch }, 120000);
    setStatus('');
    $('#preview').innerHTML = `
      <div class="card">
        <div class="big in">${r.added} added</div>
        <div class="meta" style="margin-top:8px">${r.skipped} already in your sheet, skipped</div>
        <div class="meta">${r.check} added as CHECK: same amount and date as an existing entry under a different name</div>
        ${r.enriched ? `<div class="meta">${r.enriched} existing row(s) improved with fuller names or exact times</div>` : ''}
        <a class="btn" href="index.html">Open Pending</a>
      </div>`;
    txns = [];
  } catch (err) {
    try { await api('importCancel', { batch }); } catch (_) {}
    $('#go').disabled = false;
    setStatus(`<span class="err">${esc(err.message)}.</span> Check the sheet before trying again. Re-importing is safe, because duplicates are skipped.`);
  }
}

if (!cfg().url || !cfg().key) setStatus('<span class="err">Open the Finance app and save its settings first.</span>');
</script>
