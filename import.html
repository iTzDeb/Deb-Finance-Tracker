<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<title>Import statement</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f2f3f7;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#2563eb;--green:#16a34a;--red:#dc2626}
@media (prefers-color-scheme: dark){:root{--bg:#0b1020;--card:#151c2e;--ink:#e5e9f5;--muted:#94a3b8;--line:#243049}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--card);border-bottom:1px solid var(--line);z-index:2}
.top a{color:var(--brand);text-decoration:none;font-size:17px}
.top b{font-size:17px}
main{padding:14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
select,input[type=file]{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.meta{font-size:13px;color:var(--muted)}
.big{font-size:24px;font-weight:700;margin-top:4px}
.in{color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
.btn{width:100%;padding:15px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-size:16px;font-weight:650;margin-top:14px}
.btn:disabled{opacity:.4}
.err{color:var(--red);font-weight:600}
.busy{color:var(--brand);font-weight:600}
</style>
</head>
<body>
<header class="top"><a href="index.html">‹ Back</a><b>Import statement</b></header>
<main>
  <div class="card">
    <label for="acct">Which account is this statement from?</label>
    <select id="acct">
      <option>Kotak</option><option>BOI</option><option>Mother SBI current</option>
      <option>Paytm</option><option>Google Pay</option><option>Other</option>
    </select>
    <label for="file">Statement file (CSV, Excel or PDF)</label>
    <input id="file" type="file" accept=".csv,.txt,.xlsx,.xls,.pdf">
    <div class="meta" style="margin-top:10px">Entries already in your sheet are skipped. New ones are placed in date and time order.</div>
    <div id="status" class="meta" style="margin-top:12px"></div>
  </div>
  <div id="preview"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const pad = n => String(n).padStart(2, '0');
const cfg = () => JSON.parse(localStorage.getItem('fin_cfg') || '{}');
const setStatus = html => { $('#status').innerHTML = html; };
let txns = [];

// ---------- Network (JSONP, same as the Finance app) ----------
function jsonp(params, ms = 25000) {
  return new Promise((resolve, reject) => {
    const name = 'cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const done = () => { delete window[name]; s.remove(); clearTimeout(timer); };
    const timer = setTimeout(() => { done(); reject(new Error('timed out')); }, ms);
    window[name] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('network error')); };
    s.src = cfg().url + '?' + new URLSearchParams({ ...params, callback: name });
    document.body.appendChild(s);
  });
}

async function api(action, extra = {}, ms) {
  const c = cfg();
  if (!c.url || !c.key) throw new Error('Open the Finance app and save the settings first');
  const r = await jsonp({ key: c.key, action, ...extra }, ms);
  if (!r.ok) throw new Error(r.error || 'failed');
  return r;
}

// ---------- Parsing helpers ----------
const MON = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };

function parseDate(v) {
  const s = String(v ?? '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[\/.\- ]+(\d{1,2}|[A-Za-z]{3})[\/.\- ,]+(\d{2}|\d{4})/);
  if (!m) return '';                                   // day first, as used in India
  const mo = /\d/.test(m[2]) ? Number(m[2]) : MON[m[2].toLowerCase()];
  if (!mo || mo > 12) return '';
  const y = m[3].length === 2 ? '20' + m[3] : m[3];
  return `${y}-${pad(mo)}-${pad(m[1])}`;
}

function parseTime(v) {
  const m = String(v ?? '').match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?/);
  if (!m) return '';
  let h = Number(m[1]);
  if (m[3]) {
    const pm = /p/i.test(m[3]);
    if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12;
  }
  return pad(h) + ':' + m[2];
}

function parseAmt(v) {
  const n = Number(String(v ?? '').replace(/[₹,\s]/g, '').replace(/(Dr|Cr)$/i, ''));
  return isFinite(n) ? Math.abs(n) : NaN;
}

function cleanParty(v) {
  const s = String(v ?? '').replace(/\s+/g, ' ').trim();
  const upi = s.match(/UPI\/(?:DR|CR)\/\d+\/([^\/]+)/i);   // bank narrations: UPI/DR/ref/NAME/bank
  return upi ? upi[1].trim() : s;
}

function mk(day, time, direction, amount, desc, ref, account) {
  return {
    stamp: day + (time ? ' ' + time : ''), direction, amount,
    party: cleanParty(desc), ref: String(ref || '').trim(),
    account, source: 'Import-' + account
  };
}

// ---------- Reading files ----------
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

async function pdfLines(file) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await (await pdf.getPage(p)).getTextContent();
    const rows = new Map();
    page.items.forEach(it => {
      const y = Math.round(it.transform[5] / 3);       // items on the same line share a y position
      if (!rows.has(y)) rows.set(y, []);
      rows.get(y).push(it);
    });
    [...rows.keys()].sort((a, b) => b - a).forEach(y => {
      const line = rows.get(y).sort((a, b) => a.transform[4] - b.transform[4])
        .map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
      if (line) lines.push([line]);
    });
  }
  return lines;
}

async function readRows(file) {
  const n = file.name.toLowerCase();
  if (/\.(csv|txt)$/.test(n)) return parseCSV(await file.text());
  if (/\.(xlsx|xls)$/.test(n)) {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
  }
  if (/\.pdf$/.test(n)) return pdfLines(file);
  throw new Error('Use a CSV, Excel or PDF file');
}

// Table with a header row (CSV, Excel, Paytm exports)
function fromTable(rows, account) {
  const hi = rows.findIndex(r => r.some(c => /date/i.test(String(c))) &&
    r.some(c => /amount|debit|credit|withdraw|deposit/i.test(String(c))));
  if (hi < 0) return fromLines(rows, account);
  const h = rows[hi].map(c => String(c).toLowerCase());
  const find = re => h.findIndex(c => re.test(c));
  const iDate = find(/date/), iTime = find(/time/);
  const iDesc = find(/description|narration|particular|details|remark|payee|counterparty|name/);
  const iRef = find(/ref|utr|rrn|transaction id|txn id|upi/);
  const iDr = find(/debit|withdraw|paid out/), iCr = find(/credit|deposit|received/);
  const iAmt = find(/^amount/), iType = find(/type|dr\/cr|cr\/dr/);
  const out = [];
  rows.slice(hi + 1).forEach(r => {
    const day = parseDate(r[iDate]);
    if (!day) return;
    let direction = '', amount = NaN;
    if (iDr >= 0 && parseAmt(r[iDr])) { direction = 'DEBIT'; amount = parseAmt(r[iDr]); }
    else if (iCr >= 0 && parseAmt(r[iCr])) { direction = 'CREDIT'; amount = parseAmt(r[iCr]); }
    else if (iAmt >= 0 && parseAmt(r[iAmt])) {
      amount = parseAmt(r[iAmt]);
      const t = String(r[iAmt]) + ' ' + (iType >= 0 ? r[iType] : '');
      direction = /^-|dr|debit|sent|paid/i.test(t) ? 'DEBIT' : /cr|credit|received/i.test(t) ? 'CREDIT' : 'DEBIT';
    }
    if (!direction || !(amount > 0)) return;
    const time = parseTime(iTime >= 0 ? r[iTime] : r.join(' '));
    const desc = iDesc >= 0 ? r[iDesc] : r.join(' ');
    const ref = (iRef >= 0 ? String(r[iRef]) : '') || (String(desc).match(/\b\d{12}\b/) || [''])[0];
    out.push(mk(day, time, direction, amount, desc, ref, account));
  });
  return out;
}

// Free text lines (PDF). Best effort: check the preview before importing.
function fromLines(rows, account) {
  const out = [];
  rows.forEach(r => {
    const text = (Array.isArray(r) ? r.join(' ') : String(r)).replace(/\s+/g, ' ').trim();
    const dm = text.match(/\d{1,2}[\/.\- ]+(?:\d{1,2}|[A-Za-z]{3})[\/.\- ,]+\d{2,4}/);
    const am = text.match(/\d{1,3}(?:,\d{2,3})*\.\d{2}/);
    if (!dm || !am) return;
    const day = parseDate(dm[0]);
    const amount = parseAmt(am[0]);
    if (!day || !(amount > 0)) return;
    const direction = /\bcr\b|credit|received|deposit/i.test(text) ? 'CREDIT' : 'DEBIT';
    const desc = text.slice(dm.index + dm[0].length, am.index);
    const ref = (text.match(/\b\d{12}\b/) || [''])[0];
    out.push(mk(day, parseTime(text), direction, amount, desc, ref, account));
  });
  return out;
}

// ---------- Flow ----------
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  $('#preview').innerHTML = '';
  setStatus(`<span class="busy">Reading ${esc(f.name)}…</span>`);
  try {
    txns = fromTable(await readRows(f), $('#acct').value);
    if (!txns.length) throw new Error('No transactions found. The layout may differ; send a sample.');
    setStatus('');
    renderPreview(f.name);
  } catch (err) {
    txns = [];
    setStatus(`<span class="err">${esc(err.message)}</span>`);
  }
});

function renderPreview(name) {
  const dates = txns.map(t => t.stamp.slice(0, 10)).sort();
  const paid = txns.filter(t => t.direction === 'DEBIT').reduce((s, t) => s + t.amount, 0);
  const got = txns.filter(t => t.direction === 'CREDIT').reduce((s, t) => s + t.amount, 0);
  const rows = txns.slice(0, 8).map(t => `<tr><td>${t.stamp.slice(0, 10)}</td><td>${esc(t.party)}</td>
    <td class="r">${t.direction === 'CREDIT' ? '<span class="in">+' : '−'}${inr(t.amount)}${t.direction === 'CREDIT' ? '</span>' : ''}</td></tr>`).join('');
  $('#preview').innerHTML = `
    <div class="card">
      <div class="meta">${esc(name)}</div>
      <div class="big">${txns.length} entries</div>
      <div class="meta">${dates[0]} to ${dates[dates.length - 1]}</div>
      <div class="meta" style="margin-top:8px">Paid ${inr(paid)} · Received ${inr(got)}</div>
      <table><tr><th>Date</th><th>Payee</th><th class="r">Amount</th></tr>${rows}</table>
      ${txns.length > 8 ? `<div class="meta" style="margin-top:6px">…and ${txns.length - 8} more</div>` : ''}
      <button class="btn" id="go">Import ${txns.length} entries</button>
    </div>`;
  $('#go').onclick = runImport;
}

async function runImport() {
  const batch = 'B' + Date.now();
  const CH = 12;                                       // rows per request, keeps URLs short
  $('#go').disabled = true;
  try {
    for (let i = 0; i < txns.length; i += CH) {
      setStatus(`<span class="busy">Sending ${Math.min(i + CH, txns.length)} of ${txns.length}…</span>`);
      await api('importChunk', { batch, rows: JSON.stringify(txns.slice(i, i + CH)) });
    }
    setStatus('<span class="busy">Cross-checking against your sheet…</span>');
    const r = await api('importCommit', { batch }, 120000);
    setStatus('');
    $('#preview').innerHTML = `
      <div class="card">
        <div class="big in">${r.added} added</div>
        <div class="meta" style="margin-top:8px">${r.skipped} already in your sheet, skipped</div>
        <div class="meta">${r.check} added as CHECK: same amount and date as an existing entry under a different name</div>
        <button class="btn" onclick="location.href='index.html'">Open Pending</button>
      </div>`;
    txns = [];
  } catch (err) {
    try { await api('importCancel', { batch }); } catch (_) {}
    $('#go').disabled = false;
    setStatus(`<span class="err">${esc(err.message)}.</span> Check the sheet before trying again. Re-importing is safe, because duplicates are skipped.`);
  }
}

if (!cfg().url || !cfg().key) setStatus('<span class="err">Open the Finance app and save its settings first.</span>');
</script>
</body>
</html>
